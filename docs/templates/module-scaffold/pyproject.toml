[project]
name = "{{MODULE_PACKAGE_NAME}}"
version = "0.1.0"
description = "{{MODULE_DISPLAY_NAME}} Townlight module"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "civiccore @ {{CIVICCORE_RELEASE_WHEEL_URL}}#sha256={{CIVICCORE_SHA256}}",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff==0.15.22",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

