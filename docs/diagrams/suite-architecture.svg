<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
<title id="title">Townlight connected Records Meetings Code architecture</title>
<desc id="desc">Typed desktop clients call authenticated loopback Python services. PostgreSQL owns Records, Meetings and Code. Meetings agendas connect to explicit Code adoption and separate codification; permitted public source copies attach to Records with citations and hashes. Rust retains native integration, supervision and historical import recovery; old JSON actions are retired. Final signed candidate acceptance is pending.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1a3a52"/></marker></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#1a2330}.box{fill:#e6edf3;stroke:#1a3a52;stroke-width:2}.support{fill:#f5edd6;stroke:#8a6a1f;stroke-width:2}.line{fill:none;stroke:#1a3a52;stroke-width:2;marker-end:url(#arrow)}.head{font-size:18px;font-weight:600}.body{font-size:15px}</style>
<rect width="1000" height="680" fill="#faf8f3"/>
<text x="500" y="35" text-anchor="middle" font-size="25" font-weight="600">Records + Meetings + Code 1.3.0-beta.1</text>
<text x="500" y="62" text-anchor="middle" class="body">Connected release candidate · final signed-byte acceptance pending</text>
<rect class="box" x="300" y="90" width="400" height="80" rx="8"/>
<text x="500" y="121" text-anchor="middle" class="head">Windows desktop UI</text>
<text x="500" y="151" text-anchor="middle" class="body">Typed client · authenticated loopback service calls</text>
<path class="line" d="M500 170V210"/>
<rect class="box" x="300" y="210" width="400" height="80" rx="8"/>
<text x="500" y="242" text-anchor="middle" class="head">Python/FastAPI domain authority</text>
<text x="500" y="271" text-anchor="middle" class="body">Records · Meetings · Code · Notice / Access</text>
<rect class="support" x="25" y="210" width="235" height="105" rx="8"/>
<text x="142" y="242" text-anchor="middle" class="head">Rust desktop shell</text>
<text x="142" y="270" text-anchor="middle" class="body">OS integration · supervision</text>
<text x="142" y="297" text-anchor="middle" class="body">Import / recovery retained</text>
<path class="line" stroke-dasharray="5 5" d="M300 130H142V210"/>
<rect class="support" x="740" y="210" width="235" height="105" rx="8"/>
<text x="857" y="242" text-anchor="middle" class="head">Optional local AI</text>
<text x="857" y="270" text-anchor="middle" class="body">Ollama + verified Gemma</text>
<text x="857" y="297" text-anchor="middle" class="body">On-device response drafting</text>
<path class="line" stroke-dasharray="5 5" d="M700 250H740"/>
<path class="line" d="M400 290V340H240V365"/>
<path class="line" d="M600 290V340H750V365"/>
<rect class="box" x="35" y="365" width="410" height="100" rx="8"/>
<text x="240" y="392" text-anchor="middle" class="head">PostgreSQL + local export files</text>
<text x="240" y="420" text-anchor="middle" class="body">Validated import → old JSON read-only</text>
<text x="240" y="448" text-anchor="middle" class="body">No dual writes · no fallback · canonical backups</text>
<rect class="box" x="530" y="365" width="440" height="100" rx="8"/>
<text x="750" y="396" text-anchor="middle" class="head">Changed text needs fresh human approval</text>
<text x="750" y="424" text-anchor="middle" class="body">Failed generation and unrelated edits preserve approval</text>
<text x="750" y="450" text-anchor="middle" class="body">Historical approval notes and exports remain</text>
<path class="line" d="M750 465V505"/>
<rect class="box" x="530" y="505" width="440" height="80" rx="8"/>
<text x="750" y="537" text-anchor="middle" class="head">Approved export → fulfillment → public status</text>
<text x="750" y="567" text-anchor="middle" class="body">No automatic publication of AI drafts</text>
<text x="500" y="625" text-anchor="middle" class="head">city-core: Core + Records + Meetings + Code + Notice + Access</text>
<text x="500" y="654" text-anchor="middle" class="body">Agenda → explicit adoption → codification → cited Records evidence · no JSON writer</text>
</svg>
