# DRAFT - awaiting Scott's APPROVE before the pipeline runs. Predecessors: Phase A (v0.4.0) + Phase B (runtime wired).
# Phase C: flip city-core from 5 to 6 modules in ONE lockstep changeset, after a fresh re-probe PASS.
# This is the merge that must keep the required `verify` gate green.
pipeline_run:
  id: "2026-06-28-civicaccess-city-core-phaseC-profile-flip"
  type: feature
  target_repo: "CivicSuite/civicsuite"
  branch: "feature/civicaccess-citycore-flip"
  depends_on: "Phase A (v0.4.0 cut) + Phase B (runtime valid). PRECONDITION GATE: a fresh CivicAccess depth re-probe PASSES, formally reversing the 2026-05-23 NEEDS-WORK demotion on evidence."

  goal: >
    Add CivicAccess to the city-core profile as the 6th module in a single lockstep changeset that
    updates the registry, the contract, every hard-coded 5-module gate, the compatibility/spec truth,
    and the public truth surfaces together - so `verify` stays green and no doc says "five modules"
    while the registry says six.

  active_scope:
    summary: >
      One PR, all-or-nothing. Flips civicaccess from excluded->city-core member and from
      selectable:false->true with a ready installer_status, pinned to the Phase-A v0.4.0 commit.

  preconditions:
    - "Phase A merged: CivicAccess v0.4.0 published; record its 40-char commit SHA."
    - "Phase B merged: desktop runtime wired; candidate-profile cargo test green."
    - "Fresh re-probe PASS (clean install + authz + audit + backup/restore + installer + CURRENT browser-QA) - formally reverses the demotion. Without this gate, do not flip."

  allowed_paths:
    - "installer/modules.json"                       # add to city-core profile.modules (after civicnotice); remove excluded_modules entry; selectable:true; ready installer_status; source_commit -> v0.4.0
    - "installer/module-manifest-contract.json"      # city_core_profile += civicaccess
    - "tests/test_module_manifest_contract.py"       # 5 -> 6 ordered list
    - "desktop/src-tauri/**"                         # module_registry.rs tests: city_core_registry_contract_covers_installable_modules + module_selection_defaults_to_city_core_profile -> 6; record selectable:true + ready marker
    - "scripts/verify-suite-state.py"               # check_city_core_profile_truth -> 6; drop civicaccess-exclusion assertion; civicaccess RepoSpec (0.4.0 / 1.2.0 / release_required true); add civicaccess to check_source_commit_pin + other hard-coded 5-module sets; compatibility-matrix check
    - "scripts/verify-installer-plan.py"            # check_planner city-core scenario -> 6; city-core release-artifact module list -> 6; check_cleanroom_workflow add civicaccess phrase
    - ".github/workflows/installer-cleanroom.yml"   # add civicaccess checkout step to the city-core matrix (repo, ref=v0.4.0 commit, path)
    - "docs/compatibility/index.md"                 # civicaccess row -> 0.4.0 / ==1.2.0 / in city-core
    - "docs/CivicSuiteUnifiedSpec.md"               # sec.18 civicaccess row -> in city-core
    - "docs/release-recovery-status.md"
    - "README.md"                                   # five -> six modules
    - "ANNOUNCEMENT.md"                             # five -> six modules
    - "USER-MANUAL.md"                              # five -> six modules
    - "STATUS.md"                                   # five -> six modules; clear civicaccess "OUT of city-core"
    - "FAQ.md"                                      # city-core list -> six
    - "CHANGELOG.md"                                # entry for the 6-module city-core
    - ".agent-runs/**"

  non_goals:
    - "No module code changes (Phase A) and no new desktop wiring (Phase B) - this phase only flips the switch + reconciles truth."
    - "Do NOT pin civicaccess v1.0.0."

  expected_outputs:
    - "installer/modules.json: civicaccess in city-core profile.modules (after civicnotice), excluded_modules entry removed, selectable:true, ready installer_status, source_commit = v0.4.0 commit, current_version 0.4.0, civiccore_requirement 1.2.0."
    - "All hard-coded 5-module assertions updated to 6 in lockstep: contract JSON, the contract test, the two Rust tests, verify-suite-state.py, verify-installer-plan.py."
    - "installer-cleanroom.yml has a civicaccess checkout (so Phase D packaging can resolve the 6th module); verify-suite-state check_source_commit_pin remote-validates the new pin."
    - "Compatibility matrix + UnifiedSpec sec.18 + all public truth surfaces say SIX city-core modules; no residual 'excluded/NEEDS-WORK' civicaccess text."
    - "`verify` is green on the PR; desktop cargo test (default profile now 6) is green."

  required_gates:
    - reprobe_pass                # the predecessor evidence gate (reverses the demotion)
    - human_approval_plan
    - verify_green                # the only required branch-protection check - MUST pass with 6 modules
    - cargo_test_desktop          # default city-core profile now validates as 6
    - human_approval_merge

  risk: high   # this is the change that can break the shipped city-core if any hard-coded gate is missed

  rollback_plan: >
    Single additive registry/truth changeset with no data migration. Revert the one PR to return
    city-core to the 5-module profile and re-exclude civicaccess; no down-migration needed (module
    data only exists on machines that selected it, and uninstall is backup-first per the record).

  definition_of_done: >
    city-core is a 6-module profile across the registry, the contract, every gate script + test, the
    compatibility matrix, the UnifiedSpec, and every public truth surface; `verify` and the desktop
    cargo tests are green; and the flip was preceded by a passing re-probe. This is a truth/registry
    milestone, NOT the program Definition of Done - that is Phase D.

  director_notes:
    - "executor: run `python scripts/verify-suite-state.py --remote-only` and `python scripts/verify-installer-plan.py` LOCALLY before opening the PR - they hard-code the 5-module list in multiple places; catch every one before CI."
    - "executor: this PR touches modules.json + UnifiedSpec + release-recovery-status.md + verify-suite-state.py + CHANGELOG - the release-lockstep REQUIRED_PATHS set - so if it carries the release-tag label, satisfy the lockstep gate too."
    - "critic: grep the whole repo for 'five modules' / 'five-module' / '5-module' / exact 5-name lists and confirm none remain."
