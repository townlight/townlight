[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "townlight-runtime"
version = "0.3.1"
description = "Local Windows runtime bridge for Townlight Records desktop services."
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["sqlalchemy>=2.0", "fastapi>=0.135.0", "uvicorn>=0.44.0", "pdfplumber>=0.11.10,<1", "quorumrelay==0.1.0.dev6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["townlight_runtime*"]

[tool.setuptools.package-data]
townlight_runtime = [
    "fixtures/*.json",
    "townlight_records_alembic/alembic.ini",
    "townlight_records_alembic/alembic/*.mako",
]
