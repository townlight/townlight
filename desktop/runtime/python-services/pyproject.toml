[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "civicsuite-runtime"
version = "0.1.0"
description = "Local Windows runtime bridge for Townlight Records desktop services."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["sqlalchemy>=2.0", "fastapi>=0.135.0", "uvicorn>=0.44.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["civicsuite_runtime*"]
