[package]
name = "civicsuite-desktop"
version = "1.1.0-2"
description = "Townlight Windows Local desktop shell"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
argon2 = "0.5"
getrandom = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-single-instance = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
rfd = "0.17"
