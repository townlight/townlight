name: townlight-post-foundation-demo

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: townlight_records
      POSTGRES_PASSWORD: townlight_records
      POSTGRES_DB: townlight_records_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U townlight_records"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - townlight_records-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - townlight_records-redisdata:/data

  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ollama-data:/root/.ollama

  townlight_records-api:
    build:
      context: ../../sunshine
      dockerfile: Dockerfile.backend
    env_file:
      - ../../sunshine/.env
    environment:
      TOWNLIGHT_CORE_LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      default:
        aliases:
          - api

  townlight_records-frontend:
    build:
      context: ../../sunshine
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      townlight_records-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  townlight_meetings:
    image: python:3.12-slim
    volumes:
      - "${TOWNLIGHT_DEMO_WHEELS:-../.candidate-wheels}:/wheels:ro"
    command:
      - sh
      - -c
      - >
        pip install --no-cache-dir
        /wheels/townlight_core-1.3.0.dev2-py3-none-any.whl
        /wheels/townlight_meetings-1.0.6-py3-none-any.whl
        && uvicorn townlight_meetings.main:app --host 0.0.0.0 --port 8010
    environment:
      TOWNLIGHT_CORE_LLM_PROVIDER: ollama
      TOWNLIGHT_NETWORK_PROFILE: local-demo
    ports:
      - "8010:8010"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 10

  townlight_code:
    image: python:3.12-slim
    volumes:
      - "${TOWNLIGHT_DEMO_WHEELS:-../.candidate-wheels}:/wheels:ro"
    command:
      - sh
      - -c
      - >
        pip install --no-cache-dir
        /wheels/townlight_core-1.3.0.dev2-py3-none-any.whl
        /wheels/townlight_code-1.0.9-py3-none-any.whl
        && uvicorn townlight_code.main:app --host 0.0.0.0 --port 8020
    environment:
      TOWNLIGHT_CORE_LLM_PROVIDER: ollama
      TOWNLIGHT_NETWORK_PROFILE: local-demo
    ports:
      - "8020:8020"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8020/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 10

  townlight_zoning:
    image: python:3.12-slim
    volumes:
      - "${TOWNLIGHT_DEMO_WHEELS:-../.candidate-wheels}:/wheels:ro"
    command:
      - sh
      - -c
      - >
        pip install --no-cache-dir
        /wheels/townlight_core-1.3.0.dev2-py3-none-any.whl
        /wheels/townlight_zoning-0.2.3-py3-none-any.whl
        && uvicorn townlight_zoning.main:app --host 0.0.0.0 --port 8030
    environment:
      TOWNLIGHT_CORE_LLM_PROVIDER: ollama
      TOWNLIGHT_NETWORK_PROFILE: local-demo
    ports:
      - "8030:8030"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8030/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  townlight_records-pgdata:
  townlight_records-redisdata:
  ollama-data:
