name: release-windows-msi

# Stages a Windows-Local MSI release draft (audit #20): on an annotated
# release-tag push, attach the EXACT SIGNED MSI artifact built+tested by a
# successful manual main `desktop-windows-msi` publication-signing run whose
# head SHA equals the tag target. Routine PR/main artifacts are visibly marked
# UNSIGNED and can never satisfy this workflow's artifact or signature gates.
# This workflow never makes the draft public; publication remains a separate
# human-approved action after signed clean-machine acceptance.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the MSI to (e.g. townlight-records-v1.1.0-beta.1)"
        required: true
  push:
    tags:
      - "civicsuite-windows-local-v*"
      - "townlight-records-v*"

permissions:
  contents: write
  actions: read

jobs:
  attach-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Attach the signed main-built MSI artifact to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { throw "A release tag is required." }
          Write-Host "Release tag: $tag"

          git fetch --force --tags
          $tagSha = (git rev-list -n 1 $tag).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagSha -notmatch '^[0-9a-f]{40}$') {
            throw "Could not resolve release tag $tag to a commit."
          }

          $runs = gh run list --workflow desktop-windows-msi.yml --branch main --event workflow_dispatch --status success --limit 30 --json databaseId,headSha,createdAt,url | ConvertFrom-Json
          $run = $null
          foreach ($candidate in @($runs | Where-Object { $_.headSha -eq $tagSha })) {
            $artifacts = gh api "repos/${{ github.repository }}/actions/runs/$($candidate.databaseId)/artifacts" | ConvertFrom-Json
            if (@($artifacts.artifacts | Where-Object { $_.name -eq 'civicsuite-windows-local-msi-SIGNED' }).Count -eq 1) {
              $run = $candidate
              break
            }
          }
          if (-not $run) {
            throw "No successful manual main signing run for tag SHA $tagSha has exactly one SIGNED MSI artifact."
          }
          Write-Host "Using signed MSI run: $($run.databaseId) $($run.url)"
          gh run download $run.databaseId -n civicsuite-windows-local-msi-SIGNED -D ./msi-artifact
          if ($LASTEXITCODE -ne 0) { throw "Failed to download the signed MSI artifact." }

          $msis = @(Get-ChildItem -LiteralPath ./msi-artifact -Filter *.msi -File)
          if ($msis.Count -ne 1) { throw "Expected exactly one signed MSI; found $($msis.Count)." }
          $msi = $msis[0]
          $signature = Get-AuthenticodeSignature -LiteralPath $msi.FullName
          if ($signature.Status -ne 'Valid') { throw "Release MSI Authenticode signature is not Valid." }
          if ($signature.SignerCertificate.Subject -notmatch '(^|,\s*)CN=Scott Converse(,|$)') {
            throw "Release MSI signer is not CN=Scott Converse."
          }
          if (-not $signature.TimeStamperCertificate) { throw "Release MSI has no timestamp certificate." }

          $evidenceFiles = @(Get-ChildItem -LiteralPath ./msi-artifact -Filter *evidence*.txt -File)
          if ($evidenceFiles.Count -ne 1) { throw "Expected exactly one signed MSI evidence file; found $($evidenceFiles.Count)." }
          $evidence = (Get-Content -Raw -LiteralPath $evidenceFiles[0].FullName) -replace "`r`n?", "`n"
          $signedSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $msi.FullName).Hash.ToLowerInvariant()
          if ($evidence -notmatch "(?m)^SHA256=$signedSha$") { throw "Signed MSI hash does not match its evidence file." }
          if ($evidence -notmatch '(?m)^SignatureState=Valid$') { throw "Evidence does not classify the MSI signature as Valid." }
          if ($evidence -notmatch '(?m)^PublicationAllowed=true$') { throw "Evidence does not permit publication." }

          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found; refusing release publication." }
          & $signtool.FullName verify /pa /v $msi.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool rejected the release MSI." }

          $receiptFiles = @(Get-ChildItem -LiteralPath ./msi-artifact -Filter '*signing-receipt.json' -File)
          if ($receiptFiles.Count -ne 1) { throw 'Expected exactly one signing receipt.' }
          $receipt = Get-Content -LiteralPath $receiptFiles[0].FullName -Raw | ConvertFrom-Json
          if ($receipt.source_commit -ne $tagSha -or $receipt.workflow_run -ne [string]$run.databaseId) {
            throw 'Signing receipt source/run does not match the selected release.'
          }
          $extract = Join-Path $env:RUNNER_TEMP 'townlight-release-extract'
          $p = Start-Process msiexec.exe -ArgumentList @('/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$extract`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI extraction failed: $($p.ExitCode)" }
          $embedded = @(Get-ChildItem -LiteralPath $extract -Filter civicsuite-desktop.exe -Recurse -File)
          if ($embedded.Count -ne 1) { throw 'Expected one embedded desktop executable.' }
          & ./desktop/scripts/verify-publication-signature.ps1 -Path $embedded[0].FullName
          foreach ($artifact in @($msi, $embedded[0])) {
            $entries = @($receipt.files | Where-Object { $_.file -eq $artifact.Name })
            if ($entries.Count -ne 1) { throw 'Signing receipt artifact entry is missing or ambiguous.' }
            $sig = Get-AuthenticodeSignature -LiteralPath $artifact.FullName
            $sha = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($entries[0].signed_sha256 -ne $sha -or $entries[0].unsigned_sha256 -notmatch '^[0-9a-f]{64}$' -or
                $entries[0].signer_subject -ne $sig.SignerCertificate.Subject -or
                $entries[0].signer_thumbprint -ne $sig.SignerCertificate.Thumbprint) {
              throw 'Signing receipt does not match independently verified artifact evidence.'
            }
          }

          # The annotated tag is expected to already exist (see RELEASING.md). If the
          # release object does not exist yet, create it from the tag as a DRAFT
          # prerelease for a human to finalize and explicitly publish only after
          # signed clean-machine acceptance.
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --prerelease --title "Townlight Records $tag" --notes "Automated signed Townlight Records MSI attach from main build run $($run.databaseId). Finalize notes and publish only after signed clean-machine validation."
            if ($LASTEXITCODE -ne 0) { throw "Failed to create the draft prerelease." }
          }
          gh release upload $tag $msi.FullName $evidenceFiles[0].FullName $receiptFiles[0].FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload the signed MSI release assets." }
          Write-Host "Attached the independently verified signed MSI to draft release $tag; publication remains blocked."
