name: Installed exact signed candidate reuse
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  installed:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [fresh]
    steps:
      - uses: actions/checkout@v5
        with:
          path: townlight
      - uses: actions/download-artifact@v4
        with:
          name: townlight-windows-local-msi-SIGNED
          run-id: 44681169076
          github-token: ${{ github.token }}
          path: msi-artifact
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: townlight/desktop/package-lock.json
      - run: npm ci
        working-directory: townlight/desktop
      - name: Verify provenance and run affected installed acceptance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $source='993d47567799cd8f676fb514daea7edb3636eb0b'
          $run=gh api repos/townlight/townlight/actions/runs/44681169076 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -ne $source -or $run.head_branch -ne 'main' -or $run.event -ne 'workflow_dispatch') { throw 'Original main signing run identity differs.' }
          $jobs=gh api repos/townlight/townlight/actions/runs/44681169076/jobs | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or @($jobs.jobs | Where-Object { $_.name -eq 'build Windows Local MSI' -and $_.conclusion -eq 'success' }).Count -ne 1) { throw 'Original signed build did not pass.' }
          $receipt=Get-Content msi-artifact/Townlight-signing-receipt.json -Raw | ConvertFrom-Json
          $msis=@(Get-ChildItem msi-artifact -Filter '*.msi' -File)
          $signed=@($receipt.files | Where-Object { $_.file -like '*.msi' })
          if ($receipt.source_commit -ne $source -or $receipt.workflow_run -ne '44681169076' -or $msis.Count -ne 1 -or $signed.Count -ne 1) { throw 'Signed receipt identity differs.' }
          if ((Get-FileHash $msis[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $signed[0].signed_sha256) { throw 'Signed MSI hash differs.' }
          ./townlight/desktop/scripts/test-installed-maintenance.ps1 -MsiPath $msis[0].FullName -Mode '${{ matrix.mode }}' -SourceCommit $source -EvidenceRoot "$env:RUNNER_TEMP/installed-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-installed-reuse-${{ matrix.mode }}
          path: ${{ runner.temp }}/installed-evidence
          retention-days: 7
