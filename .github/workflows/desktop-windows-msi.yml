name: Windows MSI diagnostic (throwaway)

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  msi-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Download exact MSI from run 45066607396
        uses: actions/download-artifact@v4
        with:
          name: townlight-windows-local-msi-UNSIGNED
          run-id: 45066607396
          repository: townlight/townlight
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}\msi

      - name: Verify unique MSI sha and evidence (short)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msis = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\msi" -Filter '*.msi' -Recurse -File)
          if ($msis.Count -ne 1) { throw "Expected exactly one MSI; found $($msis.Count)" }
          $msi = $msis[0]
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $msi.FullName).Hash
          Write-Host "MSI: $($msi.FullName)"
          Write-Host "Size: $($msi.Length) bytes"
          Write-Host "SHA256: $sha"

          $evidence = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\msi" -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -ne '.msi' -and $_.Name -match '(?i)manifest|sha|checksum|evidence' })
          if ($evidence.Count -eq 0) {
            Write-Host 'No manifest/evidence file; sha check skipped'
            return
          }

          $pattern = "(?i)(?<![0-9a-f])$([regex]::Escape($sha))(?![0-9a-f])"
          $match = $null
          foreach ($e in $evidence) {
            $text = Get-Content -LiteralPath $e.FullName -Raw
            if ($text -match $pattern) { $match = $e.Name; break }
          }
          if ($match) { Write-Host "OK: SHA256 found exactly in $match" }
          else { Write-Warning 'WARN: SHA256 not found in evidence files' }

      - name: Fresh headless install /i
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msis = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\msi" -Filter '*.msi' -Recurse -File)
          if ($msis.Count -ne 1) { throw "Expected exactly one MSI; found $($msis.Count)" }
          $msi = $msis[0]
          $log = Join-Path $env:RUNNER_TEMP 'townlight-msi-install.log'
          $out = Join-Path $env:RUNNER_TEMP 'townlight-msi-install.stdout.log'
          $err = Join-Path $env:RUNNER_TEMP 'townlight-msi-install.stderr.log'

          Write-Host "BEFORE install: msiexec /i $($msi.FullName)"
          $p = Start-Process msiexec.exe -ArgumentList @('/i', "`"$($msi.FullName)`"", '/quiet', '/norestart', '/l*v', "`"$log`"") -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          Write-Host "Started msiexec /i PID $($p.Id)"

          if (-not $p.WaitForExit(600000)) {
            Write-Host "msiexec /i PID $($p.Id) timeout; killing"
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 80 }
            throw 'Install timeout'
          }

          $code = $p.ExitCode
          Write-Host "AFTER install: PID $($p.Id) exit=$code"
          if (Test-Path -LiteralPath $log) { Write-Host 'Log tail:'; Get-Content -LiteralPath $log -Tail 30 }
          if ($code -ne 0 -and $code -ne 3010) { throw "Install exit $code" }

      - name: Direct repair /fa
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msis = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\msi" -Filter '*.msi' -Recurse -File)
          if ($msis.Count -ne 1) { throw "Expected exactly one MSI; found $($msis.Count)" }
          $msi = $msis[0]
          $log = Join-Path $env:RUNNER_TEMP 'townlight-msi-repair.log'
          $out = Join-Path $env:RUNNER_TEMP 'townlight-msi-repair.stdout.log'
          $err = Join-Path $env:RUNNER_TEMP 'townlight-msi-repair.stderr.log'
          $eventsLog = Join-Path $env:RUNNER_TEMP 'townlight-msi-repair.events.log'

          function Save-MsiInstallerEvents([string]$reason) {
            Write-Host "Capturing recent MsiInstaller events: $reason"
            try {
              Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='MsiInstaller'; StartTime=(Get-Date).AddMinutes(-15)} -MaxEvents 40 |
                Format-Table -AutoSize | Out-String -Width 4096 |
                Set-Content -LiteralPath $eventsLog
              Write-Host "Events written: $eventsLog"
            } catch {
              "Event query failed: $_" | Set-Content -LiteralPath $eventsLog
            }
          }

          Write-Host "BEFORE repair: msiexec /fa $($msi.FullName)"
          $p = Start-Process msiexec.exe -ArgumentList @('/fa', "`"$($msi.FullName)`"", '/quiet', '/norestart', '/l*v', "`"$log`"") -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          Write-Host "Started msiexec /fa PID $($p.Id)"

          if (-not $p.WaitForExit(300000)) {
            Write-Host "msiexec /fa PID $($p.Id) timeout; killing"
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 80 }
            Save-MsiInstallerEvents "timeout (PID $($p.Id))"
            throw 'Repair timeout'
          }

          $code = $p.ExitCode
          Write-Host "AFTER repair: PID $($p.Id) exit=$code"
          if (Test-Path -LiteralPath $log) { Write-Host 'Log tail:'; Get-Content -LiteralPath $log -Tail 30 }
          if ($code -ne 0 -and $code -ne 3010) {
            Save-MsiInstallerEvents "exit $code (PID $($p.Id))"
            throw "Repair exit $code"
          }

      - name: Upload diagnostic logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-diagnostic-logs
          path: ${{ runner.temp }}\townlight-*.log
          if-no-files-found: warn
          retention-days: 14
