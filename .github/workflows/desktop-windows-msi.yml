name: Windows MSI diagnostic after startup
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows-msi-lifecycle:
    name: Windows MSI install/first-run/backup-restore/uninstall lifecycle
    runs-on: windows-latest
    # Consume the exact MSI artifact this workflow built, not a rebuild and not
    # the legacy 0.1.x archive the Linux package lifecycle exercises.
    # Coverage and the documented gaps (GUI walkthrough, ~6.97 GB model) are in
    # docs/installer/windows-msi-ci-lifecycle-coverage-v0.1.md.
    timeout-minutes: 60
    steps:
      - name: Check out Townlight
        uses: actions/checkout@v5
        with:
          path: townlight

      - name: Download built Windows Local MSI
        uses: actions/download-artifact@v4
        with:
          name: townlight-windows-local-msi-UNSIGNED
          run-id: 45066607396
          github-token: ${{ github.token }}
          path: msi-artifact

      - name: Verify MSI artifact classification before install
        shell: pwsh
        env:
          EXPECTED_SIGNATURE_STATE: UNSIGNED
        run: |
          $msis = @(Get-ChildItem -LiteralPath "msi-artifact" -Filter "*.msi" -File -Recurse)
          if ($msis.Count -ne 1) { throw "Expected exactly one MSI; found $($msis.Count)." }
          $evidenceFiles = @(Get-ChildItem -LiteralPath "msi-artifact" -Filter "*evidence*.txt" -File -Recurse)
          if ($evidenceFiles.Count -ne 1) { throw "Expected exactly one MSI evidence file; found $($evidenceFiles.Count)." }
          $msi = $msis[0]
          $evidence = (Get-Content -Raw -LiteralPath $evidenceFiles[0].FullName) -replace "`r`n?", "`n"
          $signature = Get-AuthenticodeSignature -LiteralPath $msi.FullName

          if ($env:EXPECTED_SIGNATURE_STATE -eq "UNSIGNED") {
            if ($msi.Name -notmatch '-UNSIGNED\.msi$') { throw "Unsigned CI MSI filename is not visibly marked UNSIGNED." }
            if ($signature.Status -ne "NotSigned") { throw "Unsigned CI lane requires Authenticode state NotSigned; received $($signature.Status)." }
            if ($evidence -notmatch '(?m)^SignatureState=UNSIGNED$') { throw "Evidence does not classify the MSI as UNSIGNED." }
            if ($evidence -notmatch '(?m)^PublicationAllowed=false$') { throw "Unsigned evidence does not forbid publication." }
            exit 0
          }

          if ($env:EXPECTED_SIGNATURE_STATE -ne "Valid") { throw "Unknown expected signature state." }
          if ($signature.Status -ne "Valid") { throw "Signed lifecycle lane received an invalid signature." }
          if ($signature.SignerCertificate.Subject -notmatch '(^|,\s*)CN=Scott Converse(,|$)') {
            throw "Signed lifecycle lane received an unexpected signer."
          }
          if ($evidence -notmatch '(?m)^SignatureState=Valid$') { throw "Evidence does not classify the MSI as Valid." }
          if ($evidence -notmatch '(?m)^PublicationAllowed=true$') { throw "Signed evidence does not permit publication." }

      # ---- INSTALL ------------------------------------------------------------
      # Per-machine MSI; GitHub-hosted windows-latest runs elevated, so a silent
      # msiexec install needs no interactive UAC. We log to a file and surface the
      # exit code explicitly because msiexec returns non-zero codes (1603/1638/...)
      # that PowerShell would otherwise swallow.
      - name: Install the MSI silently
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msi = Get-ChildItem -LiteralPath "msi-artifact" -Filter "*.msi" -Recurse | Select-Object -First 1
          if (-not $msi) { throw "No MSI found in the downloaded artifact." }
          Write-Host "Installing $($msi.FullName)"
          $log = Join-Path $env:RUNNER_TEMP "townlight-msi-install.log"
          $p = Start-Process msiexec.exe -ArgumentList @("/i", "`"$($msi.FullName)`"", "/quiet", "/norestart", "/l*v", "`"$log`"") -Wait -PassThru
          Write-Host "msiexec install exit code: $($p.ExitCode)"
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          if ($p.ExitCode -ne 0) { throw "MSI install failed with exit code $($p.ExitCode)." }

      # ---- VERIFY INSTALL -----------------------------------------------------
      # Confirm the product registered an ARP/uninstall entry and the main binary
      # landed. The runtime payload (Postgres/Python) is downloaded at first run on
      # real machines; CI builds do not prepare it, so we do not check for it here.
      - name: Verify installed product and binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Read the ARP/uninstall registry entries directly (faster and more
          # reliable than Win32_Product, which can trigger MSI self-repair).
          $arpRoots = @(
            "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          $entry = Get-ItemProperty -Path $arpRoots -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like "*Townlight*" } | Select-Object -First 1
          if (-not $entry) { throw "No Townlight ARP/uninstall entry registered after install." }
          Write-Host "Installed ARP entry: $($entry.DisplayName) $($entry.DisplayVersion)"
          # Resolve install dir: prefer InstallLocation, then extract from DisplayIcon
          # (Tauri WiX sets DisplayIcon to "C:\...\binary.exe,0"), then fall back.
          $installDir = $entry.InstallLocation
          if (-not $installDir -or -not (Test-Path $installDir)) {
            if ($entry.DisplayIcon) {
              $iconExe = ($entry.DisplayIcon -split ',')[0].Trim('"')
              $installDir = Split-Path -Parent $iconExe
            }
          }
          if (-not $installDir -or -not (Test-Path $installDir)) {
            $installDir = Join-Path ${env:ProgramFiles} "Townlight"
          }
          if (-not (Test-Path $installDir)) { throw "Install directory $installDir does not exist after install." }
          Write-Host "Install directory: $installDir"
          # Find the main exe -- Tauri WiX names it from the Cargo binary at build
          # time (productName may differ from the on-disk filename); just confirm
          # any non-uninstaller exe is present rather than hardcoding a name.
          $exe = Get-ChildItem -LiteralPath $installDir -Filter "*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notlike "unins*" } | Select-Object -First 1
          if (-not $exe) { throw "No application exe found under $installDir after install." }
          Write-Host "Main binary: $($exe.FullName) ($([math]::Round($exe.Length/1KB)) KB)"
          "TOWNLIGHT_INSTALL_DIR=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TOWNLIGHT_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify installed executable trust and exact bytes
        shell: pwsh
        env:
          EXPECTED_SIGNATURE_STATE: UNSIGNED
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceFile = @(Get-ChildItem -LiteralPath msi-artifact -Filter '*evidence*.txt' -Recurse -File)
          if ($evidenceFile.Count -ne 1) { throw 'Expected exactly one MSI evidence file.' }
          $evidence = Get-Content -LiteralPath $evidenceFile[0].FullName -Raw
          $hash = (Get-FileHash -LiteralPath $env:TOWNLIGHT_EXE -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($evidence -notmatch "(?m)^InnerExecutableSHA256=$hash\r?$") { throw 'Installed executable hash differs from packaged evidence.' }
          if ($env:EXPECTED_SIGNATURE_STATE -eq 'Valid') {
            & ./townlight/desktop/scripts/verify-publication-signature.ps1 -Path $env:TOWNLIGHT_EXE
          } elseif ((Get-AuthenticodeSignature -LiteralPath $env:TOWNLIGHT_EXE).Status -ne 'NotSigned') {
            throw 'Routine CI installed executable is unexpectedly signed.'
          }

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: townlight/desktop/package-lock.json


      - name: Install desktop dependencies
        working-directory: townlight/desktop
        run: npm ci

      - name: Prepare isolated Data resident portal
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install fixture portal dependencies
        shell: pwsh
        run: |
          $dependencies = @(python -c "import tomllib; print(*tomllib.load(open('townlight/portal/pyproject.toml', 'rb'))['project']['dependencies'], sep=chr(10))")
          if ($LASTEXITCODE -or -not $dependencies) { throw 'Cannot read portal dependencies.' }
          python -m pip install @dependencies
          if ($LASTEXITCODE) { exit $LASTEXITCODE }


      - name: Launch the installed Townlight application
        shell: pwsh
        env:
          DATA_CANDIDATE_PROFILE: inspections-preview
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path -LiteralPath $env:TOWNLIGHT_EXE -PathType Leaf)) {
            throw "Installed Townlight executable is missing before launch: $env:TOWNLIGHT_EXE"
          }
          # A loader-error dialog also keeps a process alive. Require the real
          # installed WebView page, not just process survival.
          if (Get-NetTCPConnection -LocalPort 9222 -State Listen -ErrorAction SilentlyContinue) {
            throw 'Startup proof requires an unused debug port; an existing browser could give false evidence.'
          }
          $previousArguments = $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9222'
          # WebView2 150+ ignores WEBVIEW2_* environment switches in elevated
          # hosts. Use the supported HKLM policy only for this test executable
          # on the disposable runner; preserve and restore any prior value.
          $debugPolicy = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          $debugAppName = Split-Path -Leaf $env:TOWNLIGHT_EXE
          $priorKey = Get-Item -LiteralPath $debugPolicy -ErrorAction SilentlyContinue
          $hadDebugPolicy = $priorKey -and $priorKey.GetValueNames() -contains $debugAppName
          if ($hadDebugPolicy) {
            $priorDebugValue = $priorKey.GetValue($debugAppName)
            $priorDebugKind = $priorKey.GetValueKind($debugAppName)
          }
          if ($env:DATA_CANDIDATE_PROFILE -eq 'inspections-preview') {
            $env:TOWNLIGHT_SHARED_STAFF_HOST = '1'
            $env:TOWNLIGHT_PUBLISHER_PUBLISH_ORIGIN = 'http://127.0.0.1:8871'
            $root = Join-Path $env:RUNNER_TEMP ('townlight-portal-' + [guid]::NewGuid().ToString('N')); New-Item -ItemType Directory -Path $root -Force | Out-Null
            $tokenFile = Join-Path $root 'publisher-token'; $shaFile = Join-Path $root 'publisher-token.sha256'; $db = Join-Path $root 'townlight.sqlite3'; $release = Join-Path $root 'release'
            New-Item -ItemType Directory -Path $release -Force | Out-Null
            $bytes = [Text.Encoding]::ASCII.GetBytes(('Z' * 43)); [IO.File]::WriteAllBytes($tokenFile, $bytes)
            $sha = ([BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash($bytes))).Replace('-','').ToLowerInvariant(); [IO.File]::WriteAllText($shaFile, $sha, [Text.Encoding]::ASCII)
            $env:TOWNLIGHT_PORTAL_PUBLISHER_TOKEN_FILE = $tokenFile; $env:TOWNLIGHT_PORTAL_PUBLISHER_TOKEN_SHA256_FILE = $shaFile; $env:TOWNLIGHT_DB = $db; $env:TOWNLIGHT_RELEASE_ROOT = $release
            python ./townlight/portal/manage.py migrate
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          $process = $null
          try {
            New-Item -Path $debugPolicy -Force | Out-Null
            New-ItemProperty -LiteralPath $debugPolicy -Name $debugAppName -PropertyType String -Value '--remote-debugging-port=9222' -Force | Out-Null
            $process = Start-Process -FilePath $env:TOWNLIGHT_EXE -PassThru
            $ready = $false
            $deadline = (Get-Date).AddSeconds(60)
            while ((Get-Date) -lt $deadline) {
              $process.Refresh()
              if ($process.HasExited) { throw "Installed Townlight exited during startup with code $($process.ExitCode)." }
              try {
                $pages = Invoke-RestMethod 'http://127.0.0.1:9222/json/list' -TimeoutSec 2
                $ready = @($pages | Where-Object { $_.type -eq 'page' -and $_.title -eq 'Townlight' -and $_.webSocketDebuggerUrl }).Count -gt 0
              } catch { $ready = $false }
              if ($ready) { break }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              $process.Refresh()
              Write-Host "Startup diagnostic: PID=$($process.Id) Window=$($process.MainWindowTitle) Responding=$($process.Responding)"
              Get-NetTCPConnection -LocalPort 9222 -State Listen -ErrorAction SilentlyContinue | Select-Object LocalAddress,LocalPort,OwningProcess | Format-Table
              Get-CimInstance Win32_Process -Filter "name = 'msedgewebview2.exe'" | Select-Object ProcessId,ParentProcessId,ExecutablePath | Format-Table
              throw 'Installed Townlight did not open its WebView page within 60 seconds.'
            }
            Write-Host 'Installed Townlight WebView page opened. This is startup proof, not full Records acceptance.'
            if ($env:DATA_CANDIDATE_PROFILE -eq 'inspections-preview') {
              & { $PSNativeCommandUseErrorActionPreference = $false; New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/townlight-pre-repair" | Out-Null; node ./townlight/desktop/tests/installed/data-smoke.mjs 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/townlight-pre-repair/data-shutdown.log"; $code = $LASTEXITCODE; exit $code }
            }
          } finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force; $process.WaitForExit() }
            if ($hadDebugPolicy) {
              (Get-Item -LiteralPath $debugPolicy).SetValue($debugAppName, $priorDebugValue, $priorDebugKind)
            } else {
              Remove-ItemProperty -LiteralPath $debugPolicy -Name $debugAppName -ErrorAction SilentlyContinue
            }
            $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = $previousArguments
          }

      - name: Capture pre-repair evidence
        shell: pwsh
        timeout-minutes: 2
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'townlight-pre-repair'; New-Item -ItemType Directory -Force -Path $d | Out-Null
          $names = 'Townlight','townlight-desktop','postgres','pg_ctl','python','pythonw','msiexec','msedgewebview2','ollama'
          Get-CimInstance Win32_Process | Where-Object { $names -contains ($_.Name -replace '\.exe$','') } |
            Select-Object Name,ProcessId,ParentProcessId,ExecutablePath | Format-Table -AutoSize | Out-File (Join-Path $d 'processes.txt')
          Get-WinEvent -FilterHashtable @{LogName='Application';ProviderName='MsiInstaller'} -MaxEvents 50 -ErrorAction SilentlyContinue |
            Select-Object Id,TimeCreated | Format-Table -AutoSize | Out-File (Join-Path $d 'msi-events.txt')
          $r = [bool]((Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending') -or (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired') -or (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager' -Name PendingFileRenameOperations -ErrorAction SilentlyContinue).PendingFileRenameOperations)
          "RebootPending: $r" | Out-File (Join-Path $d 'state.txt')
          'FileHandleLockApproximation: skipped (no safely accessible target specified)' | Out-File (Join-Path $d 'locks.txt')
      - name: Upload pre-repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: townlight-pre-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/townlight-pre-repair/*

      - name: Stop Townlight maintenance CLI and verify runtime processes exited
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $exe = $env:TOWNLIGHT_EXE
          if (-not $exe) { throw 'TOWNLIGHT_EXE is not set' }
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "TOWNLIGHT_EXE not found: $exe" }
          $installRoot = Split-Path -Parent $exe
          if (-not $installRoot) { throw "Cannot determine install root from TOWNLIGHT_EXE: $exe" }

          $env:TOWNLIGHT_SHARED_STAFF_HOST = '1'

          Write-Host "Invoking maintenance stop: $exe --townlight-staff-host stop (installRoot=$installRoot)"
          $timeoutMs = 150000
          $proc = Start-Process -FilePath $exe `
                                -ArgumentList @('--townlight-staff-host', 'stop') `
                                -PassThru -NoNewWindow
          if (-not $proc.WaitForExit($timeoutMs)) {
              throw "townlight-staff-host stop did not exit within $($timeoutMs / 1000)s (pid $($proc.Id))"
          }
          if ($proc.ExitCode -ne 0) {
              throw "townlight-staff-host stop exited with code $($proc.ExitCode) (pid $($proc.Id))"
          }
          Write-Host "townlight-staff-host stop exited with code 0"

          $names = @('postgres.exe', 'python.exe', 'pythonw.exe')
          $deadline = (Get-Date).AddSeconds(15)
          $remaining = @()
          while ($true) {
              $remaining = @(
                  Get-CimInstance Win32_Process |
                      Where-Object {
                          $names -contains $_.Name -and
                          $_.ExecutablePath -and
                          $_.ExecutablePath.StartsWith(($installRoot + [IO.Path]::DirectorySeparatorChar), [System.StringComparison]::OrdinalIgnoreCase)
                      }
              )
              if ($remaining.Count -eq 0) { break }
              if ((Get-Date) -ge $deadline) { break }
              Start-Sleep -Milliseconds 500
          }

          if ($remaining.Count -gt 0) {
              Write-Host "Runtime processes still running under $installRoot after 15s:"
              $remaining |
                  Select-Object ProcessId, ParentProcessId, Name, ExecutablePath |
                  Format-Table -AutoSize -Wrap |
                  Out-String |
                  Write-Host
              throw "Runtime processes still running under $installRoot after grace period"
          }

          Write-Host "No postgres.exe/python.exe/pythonw.exe under $installRoot; runtime fully stopped"

      - name: Diagnose leftover Townlight postgres/python on Windows
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $roots = @((Split-Path -Parent $env:TOWNLIGHT_EXE) + [IO.Path]::DirectorySeparatorChar)
          function Test-UnderRoots([string]$p) {
            if (-not $p) { return $false }
            foreach ($r in $roots) {
              if ($p.StartsWith($r, [System.StringComparison]::OrdinalIgnoreCase)) { return $true }
            }
            return $false
          }

          $procs = Get-CimInstance Win32_Process |
            Where-Object {
              $_.Name -in @('postgres.exe','python.exe','pythonw.exe') -and
              (Test-UnderRoots $_.ExecutablePath)
            } | Sort-Object ProcessId

          "=== Traced Processes ==="
          foreach ($p in $procs) {
            $parent = $null
            try {
              if ($p.ParentProcessId -and $p.ParentProcessId -ne 0) {
                $parent = Get-CimInstance Win32_Process -Filter "ProcessId=$($p.ParentProcessId)" -ErrorAction Stop
              }
            } catch {}

            $created = if ($p.CreationDate) { $p.CreationDate.ToString('o') } else { '<unknown>' }
            "PID=$($p.ProcessId) PPID=$($p.ParentProcessId) Created=$created Name=$($p.Name) Exe=$($p.ExecutablePath)"

            if ($parent) {
              "  Parent PID=$($parent.ProcessId) Name=$($parent.Name) Exe=$($parent.ExecutablePath)"
            } else {
              "  Parent PID=$($p.ParentProcessId) Name=<not present> Exe=<not present>"
            }

            $listens = Get-NetTCPConnection -OwningProcess $p.ProcessId -State Listen -ErrorAction SilentlyContinue
            if ($listens) {
              foreach ($l in $listens) { "  Listen=$($l.LocalAddress):$($l.LocalPort)" }
            } else {
              "  Listen=<none>"
            }

            $svcs = Get-CimInstance Win32_Service -Filter "ProcessId=$($p.ProcessId)" -ErrorAction SilentlyContinue
            if ($svcs) {
              foreach ($s in $svcs) { "  Service=$($s.Name) PID=$($s.ProcessId) State=$($s.State)" }
            } else {
              "  Service=<none>"
            }

            if ($p.Name -ieq 'postgres.exe' -and $p.CommandLine) {
              $dd = $null
              if ($p.CommandLine -match '(?i)(?:^|\s)-D\s+(?:"([^"]+)"|(\S+))') {
                $dd = if ($matches[1]) { $matches[1] } else { $matches[2] }
              }
              if ($dd) {
                "  PostgresDataDir=$dd"
                $pmPath = Join-Path $dd 'postmaster.pid'
                if (Test-Path -LiteralPath $pmPath) {
                  $pm = @(Get-Content -LiteralPath $pmPath -ErrorAction SilentlyContinue)
                  if ($pm.Count -ge 1) { "  PostmasterPid=$($pm[0])" }
                  if ($pm.Count -ge 4) { "  PostmasterPort=$($pm[3])" }
                } else {
                  "  PostmasterPid=<postmaster.pid not found>"
                }
              } else {
                "  PostgresDataDir=<not found>"
              }
            }

            if ($p.Name -in @('python.exe','pythonw.exe') -and $p.CommandLine) {
              $mods = @()
              $re = [regex]'(?i)(?:^|\s)-m\s+([^\s"]+)'
              foreach ($m in $re.Matches($p.CommandLine)) {
                $mods += $m.Groups[1].Value.Trim('"', "'")
              }
              if ($mods) { "  PythonModules=$($mods -join ',')" } else { "  PythonModules=<none>" }
            }

            "---"
          }
          "=== End Traced Processes ==="
          exit 0
