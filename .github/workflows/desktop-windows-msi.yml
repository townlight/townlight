name: desktop-windows-msi

on:
  workflow_dispatch:
    inputs:
      sign_for_publication:
        description: "Sign and verify desktop EXE and MSI for publication (manual main-branch release gate only)"
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # The proven signing path currently uses a client secret passed directly to
  # azure/artifact-signing-action. A future OIDC migration must first verify that
  # the action supports an ambient workload-identity credential.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GauntletGate round-7 process fix: this workflow's 3 heavy jobs are required
  # branch-protection status checks on main. They used to be gated by a top-level
  # `paths:` filter, which meant a PR touching none of those paths (docs-only,
  # infra-only) never scheduled this workflow at all -- so the required checks
  # never reported ANY status and stayed "Expected" forever, permanently blocking
  # merge (this is exactly what happened to PR #215 and #218). A job that's
  # genuinely SKIPPED (not never-scheduled) satisfies a required status check, so
  # this job always runs and the 3 heavy jobs below are gated by its output
  # instead of the removed path filter.
  detect-desktop-changes:
    name: detect desktop changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute whether this diff touches desktop-relevant paths
        id: diff
        shell: bash
        run: |
          # Fail OPEN on any ambiguity (unrecognized event, missing/zero base SHA,
          # a failing diff command) -- always relevant=true in that case. A
          # wrongly-run pipeline wastes CI minutes; a wrongly-skipped one ships a
          # silent regression, and that asymmetry is the one that matters here.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          else
            echo "workflow_dispatch or unrecognized event -- failing open."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          zero_sha="0000000000000000000000000000000000000000"
          if [ -z "$base" ] || [ "$base" = "$zero_sha" ]; then
            echo "No usable base SHA -- failing open."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! changed=$(git diff --name-only "$base" "$head" 2>&1); then
            echo "git diff failed -- failing open. Output was:"
            echo "$changed"
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files ($base..$head):"
          echo "$changed"

          if echo "$changed" | grep -Eq '^desktop/|^\.github/workflows/desktop-windows-msi\.yml$|^installer/module-manifest-contract\.json$|^installer/modules\.json$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  windows-local-msi:
    name: build Windows Local MSI
    needs: detect-desktop-changes
    if: needs.detect-desktop-changes.outputs.relevant == 'true'
    runs-on: windows-latest
    timeout-minutes: 180
    outputs:
      artifact_name: ${{ steps.artifact_mode.outputs.artifact_name }}
      signature_state: ${{ steps.artifact_mode.outputs.signature_state }}
    steps:
      - name: Check out Townlight
        uses: actions/checkout@v5
        with:
          path: civicsuite

      - name: Check out Townlight Core runtime source
        uses: actions/checkout@v5
        with:
          repository: townlight/core
          ref: b4d0156bdc6883c1c3ef167abe0379f9ca32b258
          path: civiccore

      - name: Check out Townlight Records runtime source
        uses: actions/checkout@v5
        with:
          repository: townlight/sunshine
          ref: ff99d8c7e692ba1f75e1781f517bb54f5c618b48
          path: civicrecords-ai

      - name: Check out Townlight Notice runtime source
        uses: actions/checkout@v5
        with:
          repository: townlight/notice
          ref: 79b8d07199ee77cd425b31c0e0a44f3a0832b810
          path: civicnotice

      - name: Check out Townlight Access runtime source
        uses: actions/checkout@v5
        with:
          repository: townlight/access
          ref: b9100edc80ca496d6061f1cdb3eb39a60ff5f31a
          path: civicaccess

      - name: Validate publication-signing context
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_for_publication }}
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/main") {
            throw "Publication signing is permitted only for a manual dispatch of the main branch."
          }

      # Publication signing is an explicit manual gate. Pull requests, ordinary
      # main pushes, and manual runs with the input left false build and test a
      # clearly marked UNSIGNED MSI without requiring Azure credentials.
      #
      # When publication signing is explicitly requested, fail FAST on broken
      # credentials before the ~1h build, not after it.
      # The current client-secret flow does not use azure/login/OIDC. Prove the
      # credential can mint a Trusted Signing data-plane token directly -- the
      # exact auth azure/artifact-signing-action uses post-build.
      # A wrong/expired secret dies here in ~2s instead of after the full build.
      - name: Azure signing-credential preflight (fail fast)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_for_publication }}
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          foreach ($requiredName in @("AZURE_CLIENT_ID", "AZURE_CLIENT_SECRET", "AZURE_TENANT_ID")) {
            $requiredValue = [Environment]::GetEnvironmentVariable($requiredName)
            if ([string]::IsNullOrWhiteSpace($requiredValue)) {
              throw "Required GitHub Actions secret $requiredName is missing or empty; refusing publication signing."
            }
          }

          $body = @{
            client_id     = $env:AZURE_CLIENT_ID
            client_secret = $env:AZURE_CLIENT_SECRET
            grant_type    = "client_credentials"
            scope         = "https://codesigning.azure.net/.default"
          }
          $uri = "https://login.microsoftonline.com/$($env:AZURE_TENANT_ID)/oauth2/v2.0/token"
          # Match the proven sibling-repo preflight: hard-fail ONLY on error codes
          # that mean the secret itself is bad/expired. Anything else (transient,
          # scope/role not-yet-propagated, network) is inconclusive -- don't kill the
          # ~1h build on it; let the real sign step surface a genuine auth problem.
          try {
            $resp = Invoke-RestMethod -Method Post -Uri $uri -Body $body -ContentType "application/x-www-form-urlencoded" -ErrorAction Stop
            if ($resp.access_token) {
              Write-Host "Preflight OK: signing service principal acquired a code-signing token (expires_in=$($resp.expires_in)s)."
              exit 0
            }
            Write-Error "Preflight: token endpoint returned no access_token."
            exit 1
          } catch {
            $code = ""
            try { $code = ($_.ErrorDetails.Message | ConvertFrom-Json).error } catch {}
            if ($code -in @("invalid_client","unauthorized_client","invalid_grant")) {
              Write-Error "Preflight FAILED - bad or expired AZURE_CLIENT_SECRET ($code). Fix the secret before rebuilding."
              exit 1
            }
            Write-Warning "Preflight inconclusive ($code). The sign step will verify authorization; credential response details are suppressed."
            exit 0
          }

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: civicsuite/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        working-directory: civicsuite/desktop
        run: npm ci

      - name: Audit desktop dependencies
        working-directory: civicsuite/desktop
        run: npm audit --audit-level=moderate

      - name: Run desktop static contract checks
        working-directory: civicsuite/desktop
        run: npm test

      # QA3-2/UX3-2 (GauntletGate round 3): npm test above is JSON/string
      # contract checks only -- it cannot see broken render wiring or event
      # bindings. Nothing in required CI exercised the Playwright browser
      # suite, which is exactly why a fully-broken UI feature (civicaccess
      # delete-review's guided-review panel never rendering) shipped through
      # 3 rounds of green CI. windows-latest ships Microsoft Edge, which
      # playwright.config.mjs's channel: "msedge" uses directly -- no browser
      # download needed.
      - name: Run desktop browser (Playwright) tests
        working-directory: civicsuite/desktop
        run: npm run test:browser

      - name: Prepare portable Windows runtime payload
        working-directory: civicsuite/desktop
        shell: pwsh
        run: npm run prepare-runtime-payload

      - name: Run Tauri Rust tests
        working-directory: civicsuite/desktop/src-tauri
        env:
          CIVICSUITE_DESKTOP_STATE_DIR: ${{ runner.temp }}\townlight-unit-test-state
        run: cargo test

      - name: Check Rust formatting
        working-directory: civicsuite/desktop/src-tauri
        run: cargo fmt --check

      - name: Build desktop executable without packaging
        working-directory: civicsuite/desktop
        run: npm run tauri -- build --no-bundle

      - name: Record unsigned executable intake
        id: exe_intake
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-Item -LiteralPath "civicsuite/desktop/src-tauri/target/release/civicsuite-desktop.exe"
          if ((Get-AuthenticodeSignature -LiteralPath $exe.FullName).Status -ne 'NotSigned') {
            throw "Freshly built executable is not unsigned; refusing signing intake."
          }
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "sha256=$((Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Sign desktop executable (Azure Artifact Signing)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_for_publication }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: "https://wcus.codesigning.azure.net"
          signing-account-name: "scottconverse-signing"
          certificate-profile-name: "ScottConversePublic"
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          files: ${{ steps.exe_intake.outputs.path }}
          file-digest: "SHA256"
          timestamp-rfc3161: "http://timestamp.acs.microsoft.com"
          timestamp-digest: "SHA256"

      - name: Verify executable before packaging
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_for_publication }}
        shell: pwsh
        run: |
          & ./civicsuite/desktop/scripts/verify-publication-signature.ps1 -Path "${{ steps.exe_intake.outputs.path }}"

      - name: Record executable bytes before bundling
        id: bundle_exe_input
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath '${{ steps.exe_intake.outputs.path }}' -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Bundle the already built executable into Windows MSI
        working-directory: civicsuite/desktop
        # Never patch the already signed EXE while building the installer.
        run: npm run tauri -- bundle --bundles msi --no-binary-patching

      - name: Verify bundling preserved executable bytes
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath '${{ steps.exe_intake.outputs.path }}' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '${{ steps.bundle_exe_input.outputs.sha256 }}') { throw 'Bundling changed executable bytes after signing intake.' }

      # --- Explicit publication-signing gate ---------------------------------------
      # Azure holds the certificate in its HSM and performs the signing; nothing is
      # signed locally and no .pfx ever touches the runner. Must run on windows-latest,
      # The EXE is signed before bundling; the outer MSI is signed afterward.
      # Evidence/checksums follow both signatures because signing changes the hashes.
      # Auth = service-principal client secret passed DIRECTLY to the action. This
      # is the currently proven pattern; OIDC remains a separately verified migration.
      # FAIL-CLOSED: the config guard + two independent verification paths below
      # error the publication-signing run if the MSI is not validly signed by
      # CN=Scott Converse. Routine CI takes the separate, explicitly UNSIGNED path.
      - name: Locate built MSI
        id: locate_msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem -LiteralPath "civicsuite/desktop/src-tauri/target/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1
          if (-not $msi) { throw "Townlight Windows Local MSI was not produced." }
          if ((Get-AuthenticodeSignature -LiteralPath $msi.FullName).Status -ne 'NotSigned') {
            throw "Freshly bundled MSI is not unsigned; refusing signing intake."
          }
          "path=$($msi.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$((Get-FileHash -LiteralPath $msi.FullName -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Sign MSI (Azure Trusted Signing)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_for_publication }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: "https://wcus.codesigning.azure.net"
          signing-account-name: "scottconverse-signing"
          certificate-profile-name: "ScottConversePublic"
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          files: ${{ steps.locate_msi.outputs.path }}
          file-digest: "SHA256"
          timestamp-rfc3161: "http://timestamp.acs.microsoft.com"
          timestamp-digest: "SHA256"

      - name: Verify signature (fail-closed - never ship unsigned)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_for_publication }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found on runner; cannot verify signature." }
          Write-Host "Using $($signtool.FullName)"
          & $signtool.FullName verify /pa /v "${{ steps.locate_msi.outputs.path }}"
          if ($LASTEXITCODE -ne 0) { throw "Signature verification FAILED - the MSI is not validly signed. Refusing to publish." }

          $signature = Get-AuthenticodeSignature -LiteralPath "${{ steps.locate_msi.outputs.path }}"
          if ($signature.Status -ne "Valid") { throw "Get-AuthenticodeSignature did not return Valid." }
          if ($signature.SignerCertificate.Subject -notmatch '(^|,\s*)CN=Scott Converse(,|$)') {
            throw "Unexpected Authenticode signer; refusing to publish."
          }
          if (-not $signature.TimeStamperCertificate) { throw "Signed MSI has no timestamp certificate." }

      - name: Verify packaged executable and write signing receipt
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_for_publication }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "${{ steps.exe_intake.outputs.path }}"
          $msi = "${{ steps.locate_msi.outputs.path }}"
          $extract = Join-Path $env:RUNNER_TEMP "townlight-signed-msi-extract"
          $p = Start-Process msiexec.exe -ArgumentList @('/a', "`"$msi`"", '/qn', "TARGETDIR=`"$extract`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI extraction failed: $($p.ExitCode)" }
          $embedded = @(Get-ChildItem -LiteralPath $extract -Filter civicsuite-desktop.exe -Recurse -File)
          if ($embedded.Count -ne 1) { throw "Expected one embedded desktop executable." }
          & ./civicsuite/desktop/scripts/verify-publication-signature.ps1 -Path $embedded[0].FullName
          $exeHash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-FileHash -LiteralPath $embedded[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $exeHash) {
            throw "MSI does not contain the exact signed executable."
          }
          $receipt = [ordered]@{ schema_version = 1; source_commit = '${{ github.sha }}'; workflow_run = '${{ github.run_id }}'; files = @() }
          foreach ($item in @(@{path=$exe; unsigned='${{ steps.exe_intake.outputs.sha256 }}'}, @{path=$msi; unsigned='${{ steps.locate_msi.outputs.sha256 }}'})) {
            $sig = Get-AuthenticodeSignature -LiteralPath $item.path
            $receipt.files += [ordered]@{ file=(Split-Path $item.path -Leaf); unsigned_sha256=$item.unsigned; signed_sha256=(Get-FileHash -LiteralPath $item.path -Algorithm SHA256).Hash.ToLowerInvariant(); signer_subject=$sig.SignerCertificate.Subject; signer_thumbprint=$sig.SignerCertificate.Thumbprint; timestamp_subject=$sig.TimeStamperCertificate.Subject }
          }
          $receipt | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath "civicsuite/desktop/src-tauri/target/release/bundle/msi/Townlight-signing-receipt.json" -Encoding utf8

      - name: Classify and label MSI artifact
        id: artifact_mode
        shell: pwsh
        env:
          PUBLICATION_SIGNING: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_for_publication }}
          MSI_PATH: ${{ steps.locate_msi.outputs.path }}
        run: |
          $msi = Get-Item -LiteralPath $env:MSI_PATH
          $signature = Get-AuthenticodeSignature -LiteralPath $msi.FullName
          if ($env:PUBLICATION_SIGNING -eq "true") {
            if ($signature.Status -ne "Valid") { throw "Publication MSI is not validly signed." }
            if ($signature.SignerCertificate.Subject -notmatch '(^|,\s*)CN=Scott Converse(,|$)') {
              throw "Publication MSI signer is not CN=Scott Converse."
            }
            "artifact_name=civicsuite-windows-local-msi-SIGNED" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "signature_state=Valid" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "path=$($msi.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          if ($signature.Status -ne "NotSigned") {
            throw "Routine CI MSI signature state is $($signature.Status), not NotSigned; refusing to label it UNSIGNED."
          }
          $unsignedName = "$($msi.BaseName)-UNSIGNED$($msi.Extension)"
          $unsignedPath = Join-Path $msi.DirectoryName $unsignedName
          Move-Item -LiteralPath $msi.FullName -Destination $unsignedPath
          "artifact_name=civicsuite-windows-local-msi-UNSIGNED" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "signature_state=UNSIGNED" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "path=$unsignedPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Write MSI evidence
        shell: pwsh
        env:
          MSI_PATH: ${{ steps.artifact_mode.outputs.path }}
          SIGNATURE_STATE: ${{ steps.artifact_mode.outputs.signature_state }}
        run: |
          $msi = Get-Item -LiteralPath $env:MSI_PATH
          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $msi.FullName
          $publicationAllowed = if ($env:SIGNATURE_STATE -eq "Valid") { "true" } else { "false" }
          $evidence = @(
            "Townlight Windows Local MSI build evidence"
            "GeneratedAtUtc=$((Get-Date).ToUniversalTime().ToString('o'))"
            "File=$($msi.Name)"
            "Bytes=$($msi.Length)"
            "SHA256=$($hash.Hash.ToLowerInvariant())"
            "SignatureState=$env:SIGNATURE_STATE"
            "InnerExecutableSignatureState=$env:SIGNATURE_STATE"
            "InnerExecutableSHA256=$((Get-FileHash -LiteralPath '${{ steps.exe_intake.outputs.path }}' -Algorithm SHA256).Hash.ToLowerInvariant())"
            "PublicationAllowed=$publicationAllowed"
            "WorkflowEvent=${{ github.event_name }}"
            "WorkflowRun=${{ github.run_id }}"
            "UpgradeCode=a63fc1d3-5437-5f55-89a2-fef93fb1f930"
            "SameVersionMajorUpgrade=true"
            "InstallerBundle=msi"
            "NoDockerPrerequisite=true"
            "NoWslPrerequisite=true"
            "RuntimePayload=desktop/runtime/payload"
          )
          $evidence | Set-Content -LiteralPath "civicsuite/desktop/src-tauri/target/release/bundle/msi/Townlight-msi-evidence.txt" -Encoding UTF8

      - name: Upload UNSIGNED Windows Local MSI for private CI testing
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.sign_for_publication) }}
        uses: actions/upload-artifact@v4
        with:
          name: civicsuite-windows-local-msi-UNSIGNED
          path: |
            civicsuite/desktop/src-tauri/target/release/bundle/msi/*.msi
            civicsuite/desktop/src-tauri/target/release/bundle/msi/*evidence*.txt
          retention-days: 7

      - name: Upload SIGNED Windows Local MSI for publication gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_for_publication }}
        uses: actions/upload-artifact@v4
        with:
          name: civicsuite-windows-local-msi-SIGNED
          path: |
            civicsuite/desktop/src-tauri/target/release/bundle/msi/*.msi
            civicsuite/desktop/src-tauri/target/release/bundle/msi/*evidence*.txt
            civicsuite/desktop/src-tauri/target/release/bundle/msi/*signing-receipt.json
          retention-days: 7

  desktop-civiccore-integration:
    name: desktop<->CivicCore real-runtime integration test
    needs: detect-desktop-changes
    if: needs.detect-desktop-changes.outputs.relevant == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out Townlight
        uses: actions/checkout@v5
        with:
          path: civicsuite

      - name: Check out Townlight Core runtime source
        uses: actions/checkout@v5
        with:
          repository: townlight/core
          ref: b4d0156bdc6883c1c3ef167abe0379f9ca32b258
          path: civiccore

      - name: Check out Townlight Records runtime source
        uses: actions/checkout@v5
        with:
          repository: townlight/sunshine
          ref: ff99d8c7e692ba1f75e1781f517bb54f5c618b48
          path: civicrecords-ai

      - name: Check out Townlight Notice runtime source
        uses: actions/checkout@v5
        with:
          repository: townlight/notice
          ref: 79b8d07199ee77cd425b31c0e0a44f3a0832b810
          path: civicnotice

      - name: Check out Townlight Access runtime source
        uses: actions/checkout@v5
        with:
          repository: townlight/access
          ref: b9100edc80ca496d6061f1cdb3eb39a60ff5f31a
          path: civicaccess

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: civicsuite/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        working-directory: civicsuite/desktop
        run: npm ci

      # Builds the portable Windows runtime payload the wired contract needs:
      # bundled PostgreSQL 17 + pgvector, the embedded CPython city services, and
      # the PostgreSQL-backed task-queue worker. This is the real Postgres + worker
      # the integration test exercises -- no external service is provisioned because
      # the product ships its own portable stack. The ~6.97 GB Gemma model is NOT
      # downloaded here (only first-run pulls it); this job proves the
      # desktop<->CivicCore data-plane contract without the heavy model.
      - name: Prepare portable Windows runtime payload
        working-directory: civicsuite/desktop
        shell: pwsh
        run: npm run prepare-runtime-payload

      - name: Run desktop<->CivicCore real-runtime integration test
        working-directory: civicsuite/desktop/src-tauri
        shell: pwsh
        env:
          # Un-gates the real-runtime contract test that is a no-op when unset.
          CIVICSUITE_RUN_REAL_RUNTIME_TEST: "1"
          # Point the test at the payload just prepared above.
          CIVICSUITE_RUNTIME_PAYLOAD_DIR: ${{ github.workspace }}\civicsuite\desktop\runtime\payload
        run: |
          cargo test -- --nocapture --test-threads=1 real_postgres_payload_initializes_and_migrates_when_enabled real_ollama_runtime_with_no_model_serves_the_not_ready_contract_when_enabled

      - name: Upload integration runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-civiccore-integration-logs
          path: civicsuite/desktop/runtime/payload/runtime-payload-lock.json
          retention-days: 7

  windows-msi-lifecycle:
    name: Windows MSI install/first-run/backup-restore/uninstall lifecycle
    runs-on: windows-latest
    # Consume the exact MSI artifact this workflow built, not a rebuild and not
    # the legacy 0.1.x archive the Linux package lifecycle exercises.
    # Coverage and the documented gaps (GUI walkthrough, ~6.97 GB model) are in
    # docs/installer/windows-msi-ci-lifecycle-coverage-v0.1.md.
    needs: [detect-desktop-changes, windows-local-msi]
    if: needs.detect-desktop-changes.outputs.relevant == 'true'
    timeout-minutes: 60
    steps:
      - name: Check out Townlight
        uses: actions/checkout@v5
        with:
          path: civicsuite

      - name: Download built Windows Local MSI
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows-local-msi.outputs.artifact_name }}
          path: msi-artifact

      - name: Verify MSI artifact classification before install
        shell: pwsh
        env:
          EXPECTED_SIGNATURE_STATE: ${{ needs.windows-local-msi.outputs.signature_state }}
        run: |
          $msis = @(Get-ChildItem -LiteralPath "msi-artifact" -Filter "*.msi" -File -Recurse)
          if ($msis.Count -ne 1) { throw "Expected exactly one MSI; found $($msis.Count)." }
          $evidenceFiles = @(Get-ChildItem -LiteralPath "msi-artifact" -Filter "*evidence*.txt" -File -Recurse)
          if ($evidenceFiles.Count -ne 1) { throw "Expected exactly one MSI evidence file; found $($evidenceFiles.Count)." }
          $msi = $msis[0]
          $evidence = (Get-Content -Raw -LiteralPath $evidenceFiles[0].FullName) -replace "`r`n?", "`n"
          $signature = Get-AuthenticodeSignature -LiteralPath $msi.FullName

          if ($env:EXPECTED_SIGNATURE_STATE -eq "UNSIGNED") {
            if ($msi.Name -notmatch '-UNSIGNED\.msi$') { throw "Unsigned CI MSI filename is not visibly marked UNSIGNED." }
            if ($signature.Status -ne "NotSigned") { throw "Unsigned CI lane requires Authenticode state NotSigned; received $($signature.Status)." }
            if ($evidence -notmatch '(?m)^SignatureState=UNSIGNED$') { throw "Evidence does not classify the MSI as UNSIGNED." }
            if ($evidence -notmatch '(?m)^PublicationAllowed=false$') { throw "Unsigned evidence does not forbid publication." }
            exit 0
          }

          if ($env:EXPECTED_SIGNATURE_STATE -ne "Valid") { throw "Unknown expected signature state." }
          if ($signature.Status -ne "Valid") { throw "Signed lifecycle lane received an invalid signature." }
          if ($signature.SignerCertificate.Subject -notmatch '(^|,\s*)CN=Scott Converse(,|$)') {
            throw "Signed lifecycle lane received an unexpected signer."
          }
          if ($evidence -notmatch '(?m)^SignatureState=Valid$') { throw "Evidence does not classify the MSI as Valid." }
          if ($evidence -notmatch '(?m)^PublicationAllowed=true$') { throw "Signed evidence does not permit publication." }

      # ---- INSTALL ------------------------------------------------------------
      # Per-machine MSI; GitHub-hosted windows-latest runs elevated, so a silent
      # msiexec install needs no interactive UAC. We log to a file and surface the
      # exit code explicitly because msiexec returns non-zero codes (1603/1638/...)
      # that PowerShell would otherwise swallow.
      - name: Install the MSI silently
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msi = Get-ChildItem -LiteralPath "msi-artifact" -Filter "*.msi" -Recurse | Select-Object -First 1
          if (-not $msi) { throw "No MSI found in the downloaded artifact." }
          Write-Host "Installing $($msi.FullName)"
          $log = Join-Path $env:RUNNER_TEMP "civicsuite-msi-install.log"
          $p = Start-Process msiexec.exe -ArgumentList @("/i", "`"$($msi.FullName)`"", "/quiet", "/norestart", "/l*v", "`"$log`"") -Wait -PassThru
          Write-Host "msiexec install exit code: $($p.ExitCode)"
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          if ($p.ExitCode -ne 0) { throw "MSI install failed with exit code $($p.ExitCode)." }

      # ---- VERIFY INSTALL -----------------------------------------------------
      # Confirm the product registered an ARP/uninstall entry and the main binary
      # landed. The runtime payload (Postgres/Python) is downloaded at first run on
      # real machines; CI builds do not prepare it, so we do not check for it here.
      - name: Verify installed product and binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Read the ARP/uninstall registry entries directly (faster and more
          # reliable than Win32_Product, which can trigger MSI self-repair).
          $arpRoots = @(
            "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          $entry = Get-ItemProperty -Path $arpRoots -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like "*Townlight*" } | Select-Object -First 1
          if (-not $entry) { throw "No Townlight ARP/uninstall entry registered after install." }
          Write-Host "Installed ARP entry: $($entry.DisplayName) $($entry.DisplayVersion)"
          # Resolve install dir: prefer InstallLocation, then extract from DisplayIcon
          # (Tauri WiX sets DisplayIcon to "C:\...\binary.exe,0"), then fall back.
          $installDir = $entry.InstallLocation
          if (-not $installDir -or -not (Test-Path $installDir)) {
            if ($entry.DisplayIcon) {
              $iconExe = ($entry.DisplayIcon -split ',')[0].Trim('"')
              $installDir = Split-Path -Parent $iconExe
            }
          }
          if (-not $installDir -or -not (Test-Path $installDir)) {
            $installDir = Join-Path ${env:ProgramFiles} "Townlight"
          }
          if (-not (Test-Path $installDir)) { throw "Install directory $installDir does not exist after install." }
          Write-Host "Install directory: $installDir"
          # Find the main exe -- Tauri WiX names it from the Cargo binary at build
          # time (productName may differ from the on-disk filename); just confirm
          # any non-uninstaller exe is present rather than hardcoding a name.
          $exe = Get-ChildItem -LiteralPath $installDir -Filter "*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notlike "unins*" } | Select-Object -First 1
          if (-not $exe) { throw "No application exe found under $installDir after install." }
          Write-Host "Main binary: $($exe.FullName) ($([math]::Round($exe.Length/1KB)) KB)"
          "TOWNLIGHT_INSTALL_DIR=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TOWNLIGHT_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify installed executable trust and exact bytes
        shell: pwsh
        env:
          EXPECTED_SIGNATURE_STATE: ${{ needs.windows-local-msi.outputs.signature_state }}
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceFile = @(Get-ChildItem -LiteralPath msi-artifact -Filter '*evidence*.txt' -Recurse -File)
          if ($evidenceFile.Count -ne 1) { throw 'Expected exactly one MSI evidence file.' }
          $evidence = Get-Content -LiteralPath $evidenceFile[0].FullName -Raw
          $hash = (Get-FileHash -LiteralPath $env:TOWNLIGHT_EXE -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($evidence -notmatch "(?m)^InnerExecutableSHA256=$hash\r?$") { throw 'Installed executable hash differs from packaged evidence.' }
          if ($env:EXPECTED_SIGNATURE_STATE -eq 'Valid') {
            & ./civicsuite/desktop/scripts/verify-publication-signature.ps1 -Path $env:TOWNLIGHT_EXE
          } elseif ((Get-AuthenticodeSignature -LiteralPath $env:TOWNLIGHT_EXE).Status -ne 'NotSigned') {
            throw 'Routine CI installed executable is unexpectedly signed.'
          }

      - name: Launch the installed Townlight application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path -LiteralPath $env:TOWNLIGHT_EXE -PathType Leaf)) {
            throw "Installed Townlight executable is missing before launch: $env:TOWNLIGHT_EXE"
          }
          $process = Start-Process -FilePath $env:TOWNLIGHT_EXE -PassThru
          Start-Sleep -Seconds 15
          if ($process.HasExited) {
            throw "Installed Townlight application exited during launch smoke test with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force
          $process.WaitForExit()
          Write-Host "Installed Townlight application launched and remained running for the smoke interval."

      - name: Repair the installed Townlight MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msi = Get-ChildItem -LiteralPath "msi-artifact" -Filter "*.msi" -Recurse | Select-Object -First 1
          if (-not $msi) { throw "No MSI found for repair." }
          $log = Join-Path $env:RUNNER_TEMP "townlight-msi-repair.log"
          $p = Start-Process msiexec.exe -ArgumentList @("/fa", "`"$($msi.FullName)`"", "/quiet", "/norestart", "/l*v", "`"$log`"") -Wait -PassThru
          Write-Host "msiexec repair exit code: $($p.ExitCode)"
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          if ($p.ExitCode -notin @(0, 3010)) { throw "MSI repair failed with exit code $($p.ExitCode)." }
          if (-not (Test-Path -LiteralPath $env:TOWNLIGHT_EXE -PathType Leaf)) {
            throw "Townlight executable is missing after MSI repair."
          }

      # ---- FIRST-RUN + BACKUP/RESTORE (verifiable subset) ---------------------
      # The shipped UI is a Tauri/WebView2 GUI with no headless entry point, so the
      # interactive first-run wizard and GUI-driven backup/restore cannot be driven
      # on a hosted runner without a real desktop UI-automation session (this is the
      # standing QA-B1 clean-VM blocker). What IS verifiable here -- and what the
      # product's first-run, backup, and restore *logic* actually is -- runs as the
      # desktop crate's tests against the state-dir isolation hook
      # (CIVICSUITE_DESKTOP_STATE_DIR), exercised below. This proves the install
      # produced a working runtime whose lifecycle code passes on this machine,
      # without claiming a GUI walkthrough that did not happen.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: civicsuite/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        working-directory: civicsuite/desktop
        run: npm ci

      - name: Exercise first-run, backup, and restore lifecycle logic (isolated state dir)
        working-directory: civicsuite/desktop/src-tauri
        shell: pwsh
        env:
          CIVICSUITE_DESKTOP_STATE_DIR: ${{ runner.temp }}\civicsuite-lifecycle-state
        run: |
          # first_run::* and supervisor backup/restore unit+integration tests run
          # against an isolated state dir; this is the headless-feasible proof of
          # first-run -> backup -> restore behavior for the installed runtime.
          cargo test first_run -- --nocapture
          cargo test backup -- --nocapture
          cargo test restore -- --nocapture
          # civicaccess: same headless-feasible proof, for the module this lifecycle
          # job previously never ran (TEST-7) -- the desktop-windows-msi build job
          # runs the full civicaccess suite too, but this job is the one that
          # follows a real msiexec install/uninstall cycle, so cover it here as well.
          cargo test civicaccess -- --nocapture

      # ---- UNINSTALL ----------------------------------------------------------
      - name: Uninstall the MSI silently
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msi = Get-ChildItem -LiteralPath "msi-artifact" -Filter "*.msi" -Recurse | Select-Object -First 1
          $log = Join-Path $env:RUNNER_TEMP "civicsuite-msi-uninstall.log"
          $p = Start-Process msiexec.exe -ArgumentList @("/x", "`"$($msi.FullName)`"", "/quiet", "/norestart", "/l*v", "`"$log`"") -Wait -PassThru
          Write-Host "msiexec uninstall exit code: $($p.ExitCode)"
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          if ($p.ExitCode -ne 0) { throw "MSI uninstall failed with exit code $($p.ExitCode)." }

      - name: Verify product removed after uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $arpRoots = @(
            "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          $entry = Get-ItemProperty -Path $arpRoots -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like "*Townlight*" } | Select-Object -First 1
          if ($entry) { throw "Townlight ARP entry still present after uninstall: $($entry.DisplayName) $($entry.DisplayVersion)." }
          $installDir = Join-Path ${env:ProgramFiles} "Townlight"
          $exe = Get-ChildItem -LiteralPath $installDir -Filter "*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notlike "unins*" } | Select-Object -First 1
          if ($exe) { throw "Application exe still present under $installDir after uninstall: $($exe.FullName)." }
          # QA-4: also confirm the uninstaller didn't leave city-work.json behind under
          # the real per-user data path (not the isolated CIVICSUITE_DESKTOP_STATE_DIR
          # used by the cargo lifecycle tests above). NOTE -- the interactive GUI
          # first-run wizard does not execute in this job (see QA-5 / the comment
          # above "Exercise first-run..."), so this job never writes real user data to
          # %LOCALAPPDATA%\CivicSuite in the first place; this legacy compatibility
          # path is intentionally preserved across the public display rename. This proves
          # "the uninstaller and this job's own actions did not leak state into the
          # real per-user path," not "a real clerk's saved city-work.json is purged on
          # uninstall." That stronger claim needs a real GUI walkthrough (Phase D).
          $realUserData = Join-Path $env:LOCALAPPDATA "CivicSuite\workflows\city-work.json"
          if (Test-Path $realUserData) { throw "city-work.json still present under the real per-user data path after uninstall: $realUserData." }
          Write-Host "Uninstall verified: product deregistered, main binary removed, no real per-user data path leak."

      - name: Upload MSI lifecycle logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-lifecycle-logs
          path: ${{ runner.temp }}\civicsuite-msi-*.log
          retention-days: 7
