name: release-lockstep-gate

on:
  workflow_dispatch:
  pull_request:
    # Docs-only changes start no CI run (docs get push, merge and publish only).
    paths: ['**', '!**.md', '!**.mdx', '!**.rst', '!**.docx', '!**.pdf', '!**/LICENSE', '!**/LICENSE.*', '!**/NOTICE', '!**/NOTICE.*', '!docs/**.png', '!docs/**.jpg', '!docs/**.svg', '!docs/**.gif', '!docs/**.webp', '!docs/**.html', '!docs/**.css', '**/SKILL.md', '**/skills/**', '**/agents/**', '**/commands/**', '**/prompts/**', '**/references/**', '.claude/**']
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    tags:
      - "civicsuite-windows-local-v*"
      - "installer-*-v*"

jobs:
  release-lockstep-gate:
    # On PRs only gate release-tag-labeled PRs; on a release tag push, always run.
    # Hosted runner (the old self-hosted runners were offline, silently skipping the gate).
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'release-tag')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release truth artifacts move together
        # PR-only: the lockstep diff (release-truth files changed together) is a
        # PR-time check. On a release-tag push the tag is an ancestor of main so
        # the diff is empty; running it there always fails. Tag pushes are gated
        # by the suite-state check below instead.
        if: github.event_name == 'pull_request'
        run: python scripts/verify-release-lockstep.py
      - name: Verify suite state (pins, versions, releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify-suite-state.py --remote-only
