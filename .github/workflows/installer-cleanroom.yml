name: Windows 1.8.2.1 to 1.9.0.1 signed upgrade

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  published-upgrade:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact townlight ref
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: 5c386c6eb95df980d0b117c9a49aacf65b23b23d
          path: townlight

      - name: Download the exact published Windows 1.9.0.1 MSI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download townlight-windows-v1.9.0.1 -R townlight/townlight --pattern Townlight-Windows-x64-1.9.0.1.msi --dir msi-artifact
          if ($LASTEXITCODE) { throw 'Published target MSI download failed' }

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install desktop dependencies
        working-directory: townlight/desktop
        run: npm ci

      - name: Free C drive for install-only test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_OS -ne 'Windows' -or -not $env:ImageOS -or -not $env:GITHUB_REPOSITORY) { throw 'Unsafe host' }
          $target = 'C:\Program Files\Microsoft Visual Studio\18'
          $parent = 'C:\Program Files\Microsoft Visual Studio'
          if ((Split-Path -Parent $target) -ne $parent) { throw 'Parent mismatch' }
          $free = { ([IO.DriveInfo]::new('C:\')).AvailableFreeSpace }
          $before = & $free
          Write-Host "C: available before: $before bytes"
          if ($before -ge 42GB) { Write-Host 'Already sufficient'; exit 0 }
          $p = $target
          while ($p) { $i = Get-Item -LiteralPath $p -Force; if (($i.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw "Reparse point: $p" }; $p = Split-Path -Parent $p }
          $removed=0; $skipped=0
          $stack=[Collections.Generic.Stack[string]]::new()
          $stack.Push($target)
          while($stack.Count -gt 0 -and [double](& $free) -lt 42GB){
            $dir=$stack.Pop()
            try{
              $a=[IO.File]::GetAttributes($dir)
              if(($a -band [IO.FileAttributes]::ReparsePoint) -or -not ($a -band [IO.FileAttributes]::Directory)){$skipped++;continue}
            }catch{$skipped++;continue}
            try{
              foreach($p in [IO.Directory]::EnumerateFileSystemEntries($dir)){
                try{
                  $e=[IO.File]::GetAttributes($p)
                  if($e -band [IO.FileAttributes]::ReparsePoint){$skipped++;continue}
                  if($e -band [IO.FileAttributes]::Directory){$stack.Push($p)}
                  else{
                    try{[IO.File]::Delete($p);$removed++}catch{$skipped++}
                  }
                }catch{$skipped++}
              }
            }catch{$skipped++}
          }
          Write-Host "removed=$removed skipped=$skipped freeBytes=$([double](& $free))"
          $after = & $free
          Write-Host "C: available after: $after bytes"
          if ($after -lt 42GB) { throw "Insufficient C: available: $after bytes" }

      - name: Verify the signed published MSI and test the direct upgrade
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $msi=(Resolve-Path 'msi-artifact/Townlight-Windows-x64-1.9.0.1.msi').Path
          $hash='fde5cfd9d167571792e2384f7a5066b1dbea3fdc8b2085cf43f670440210ff0c'
          if ((Get-FileHash -LiteralPath $msi).Hash.ToLowerInvariant() -ne $hash) { throw 'Published target all-bytes hash mismatch' }
          & ./upgrade-baseline/prepare-harness.ps1 -Checkout (Resolve-Path townlight).Path
          & ./townlight/desktop/scripts/test-installed-maintenance.ps1 -Mode upgrade -SourceCommit '5c386c6eb95df980d0b117c9a49aacf65b23b23d' -MsiPath $msi -EvidenceRoot (Join-Path $env:RUNNER_TEMP 'recorder-evidence')

      - name: Collect redacted logs and scheduled task state
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'recorder-evidence'
          $diag = Join-Path $evidence 'diagnostics'
          New-Item -ItemType Directory -Force -Path $diag | Out-Null

          function Redact([string]$text) {
            $text = $text -replace '(?i)\b(?:postgres(?:ql)?(?:\+[a-z0-9_]+)?|mysql|mssql|mongodb(?:\+srv)?|redis)://[^\s''"]+', '[REDACTED_DB_URI]'
            $text = $text -replace '(?i)(\b(?:password|passwd|pwd)\s*[=:]\s*)[^\s;,''"]+', '$1[REDACTED]'
            $text = $text -replace '(?i)(\b(?:db_?uri|database_?url|postgres_?url|pgurl)\s*[=:]\s*)[^\s;,''"]+', '$1[REDACTED]'
            return $text
          }

          $locationsFile = Join-Path (Join-Path (Join-Path $env:LOCALAPPDATA "CivicSuite") "config") "locations.json"
          $dataRoot = Join-Path (Join-Path $env:LOCALAPPDATA "CivicSuite") "Data"
          if (Test-Path $locationsFile) {
            $loc = Get-Content $locationsFile -Raw | ConvertFrom-Json
            if ($loc.data_root) { $dataRoot = $loc.data_root }
          }
          $station = Join-Path $dataRoot "station"
          foreach ($name in 'background.log','postgres-start.log','postgres.log','serve.log','worker.log') {
            $src = Join-Path $station $name
            if (Test-Path -LiteralPath $src) {
              Get-Content -LiteralPath $src -Tail 50 -ErrorAction Stop |
                ForEach-Object { Redact $_ } |
                Set-Content -LiteralPath (Join-Path $diag $name) -Encoding utf8
            }
          }

          $tasks = @(Get-ScheduledTask | Where-Object { $_.TaskName -like '*Townlight*Station*' -or $_.TaskPath -like '*Townlight*Station*' })
          $taskInfo = foreach ($task in $tasks) {
            $info = Get-ScheduledTaskInfo -TaskName $task.TaskName -TaskPath $task.TaskPath
            [pscustomobject]@{
              TaskName = $task.TaskName
              TaskPath = $task.TaskPath
              State = $task.State.ToString()
              LastTaskResult = $info.LastTaskResult
            }
          }
          $taskInfo | Format-List | Out-String | Set-Content -LiteralPath (Join-Path $diag 'townlight-station-task-info.txt') -Encoding utf8

      - name: Upload recorder evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-evidence
          path: ${{ runner.temp }}/recorder-evidence
          if-no-files-found: warn
