name: Temporary Windows Recorder Diagnostics

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  recorder-diagnostics:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact townlight ref
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: 6b298f37d3cca5d3250bc7ab4cf0d4f23eaaa1ec
          path: townlight

      - name: Download unsigned MSI artifact
        uses: actions/download-artifact@v4
        with:
          name: townlight-windows-local-msi-UNSIGNED
          run-id: 44807689486
          github-token: ${{ github.token }}
          path: msi-artifact

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install desktop dependencies
        working-directory: townlight/desktop
        run: npm ci

      - name: Run unsigned recorder maintenance test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msis = @(Get-ChildItem -LiteralPath 'msi-artifact' -Recurse -File -Filter '*.msi')
          if ($msis.Count -ne 1) { throw "Expected exactly one MSI, found $($msis.Count)." }
          $msi = $msis[0]
          $sha = (Get-FileHash -LiteralPath $msi.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $evidence = Join-Path $env:RUNNER_TEMP 'recorder-evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          & 'townlight/desktop/scripts/test-installed-maintenance.ps1' `
            -Mode recorder `
            -UnsignedRecorderCandidate `
            -ExpectedMsiSha256 $sha `
            -MsiPath $msi.FullName `
            -EvidenceRoot $evidence
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Collect redacted logs and scheduled task state
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'recorder-evidence'
          $diag = Join-Path $evidence 'diagnostics'
          New-Item -ItemType Directory -Force -Path $diag | Out-Null

          function Redact([string]$text) {
            $text = $text -replace '(?i)\b(?:postgres(?:ql)?|mysql|mssql|mongodb(?:\+srv)?|redis)://[^\s''"]+', '[REDACTED_DB_URI]'
            $text = $text -replace '(?i)(\b(?:password|passwd|pwd)\s*[=:]\s*)[^\s;,''"]+', '$1[REDACTED]'
            $text = $text -replace '(?i)(\b(?:db_?uri|database_?url|postgres_?url|pgurl)\s*[=:]\s*)[^\s;,''"]+', '$1[REDACTED]'
            return $text
          }

          $station = Join-Path $env:LOCALAPPDATA 'CivicSuite/Data/station'
          foreach ($name in 'background.log','postgres.log','serve.log','worker.log') {
            $src = Join-Path $station $name
            if (Test-Path -LiteralPath $src) {
              Get-Content -LiteralPath $src -Tail 50 -ErrorAction Stop |
                ForEach-Object { Redact $_ } |
                Set-Content -LiteralPath (Join-Path $diag $name) -Encoding utf8
            }
          }

          $tasks = @(Get-ScheduledTask | Where-Object { $_.TaskName -like '*Townlight*Station*' -or $_.TaskPath -like '*Townlight*Station*' })
          $taskInfo = foreach ($task in $tasks) {
            $info = Get-ScheduledTaskInfo -TaskName $task.TaskName -TaskPath $task.TaskPath
            [pscustomobject]@{
              TaskName = $task.TaskName
              TaskPath = $task.TaskPath
              State = $task.State.ToString()
              LastTaskResult = $info.LastTaskResult
            }
          }
          $taskInfo | Format-List | Out-String | Set-Content -LiteralPath (Join-Path $diag 'townlight-station-task-info.txt') -Encoding utf8

      - name: Upload recorder evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recorder-evidence
          path: ${{ runner.temp }}/recorder-evidence
          if-no-files-found: warn
