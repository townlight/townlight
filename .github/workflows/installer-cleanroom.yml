name: windows-readonly-smoke-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Read-only disk and tool-cache probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ProgressPreference = 'SilentlyContinue'

          function Format-Bytes {
            param([Nullable[long]]$Bytes)
            if ($null -eq $Bytes) { return 'n/a' }
            $b = [long]$Bytes
            if ($b -ge 1TB) { return ('{0:N2} TiB' -f ($b / 1TB)) }
            if ($b -ge 1GB) { return ('{0:N2} GiB' -f ($b / 1GB)) }
            if ($b -ge 1MB) { return ('{0:N2} MiB' -f ($b / 1MB)) }
            if ($b -ge 1KB) { return ('{0:N2} KiB' -f ($b / 1KB)) }
            return "$b B"
          }

          function Measure-LogicalBytes {
            param([string]$Path)

            if ([string]::IsNullOrWhiteSpace($Path)) { return $null }
            try {
              if (-not [System.IO.Directory]::Exists($Path)) { return $null }
              $rootFull = [System.IO.Path]::GetFullPath($Path)
              $rootAttrs = [System.IO.File]::GetAttributes($rootFull)
              if (($rootAttrs -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) { return [long]0 }
            } catch {
              return $null
            }

            $sum = [long]0
            $stack = [System.Collections.Generic.Stack[string]]::new()
            $stack.Push($rootFull)

            while ($stack.Count -gt 0) {
              $dir = $stack.Pop()
              try {
                foreach ($entry in [System.IO.Directory]::EnumerateFileSystemEntries($dir)) {
                  try {
                    $attrs = [System.IO.File]::GetAttributes($entry)
                    if (($attrs -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) { continue }
                    if (($attrs -band [System.IO.FileAttributes]::Directory) -ne 0) {
                      $stack.Push($entry)
                    } else {
                      $sum += ([System.IO.FileInfo]::new($entry)).Length
                    }
                  } catch {
                    # Skip inaccessible entries.
                  }
                }
              } catch {
                # Skip inaccessible directories.
              }
            }
            return $sum
          }

          function Measure-RootSummary {
            param(
              [string]$Path,
              [switch]$Children
            )

            $result = [pscustomobject]@{
              Exists   = $false
              Bytes    = [long]0
              Children = @()
            }

            if ([string]::IsNullOrWhiteSpace($Path)) { return $result }
            try {
              if (-not [System.IO.Directory]::Exists($Path)) { return $result }
              $rootFull = [System.IO.Path]::GetFullPath($Path)
              $rootAttrs = [System.IO.File]::GetAttributes($rootFull)
              if (($rootAttrs -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
                $result.Exists = $true
                return $result
              }
            } catch {
              return $result
            }

            $result.Exists = $true
            $total = [long]0
            $childList = [System.Collections.Generic.List[object]]::new()

            try {
              foreach ($entry in [System.IO.Directory]::EnumerateFileSystemEntries($rootFull)) {
                try {
                  $attrs = [System.IO.File]::GetAttributes($entry)
                  if (($attrs -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) { continue }
                  if (($attrs -band [System.IO.FileAttributes]::Directory) -ne 0) {
                    $childBytes = Measure-LogicalBytes -Path $entry
                    if ($null -eq $childBytes) { $childBytes = [long]0 }
                    $total += $childBytes
                    if ($Children) {
                      $childList.Add([pscustomobject]@{
                        Name  = [System.IO.Path]::GetFileName($entry)
                        Path  = $entry
                        Bytes = [long]$childBytes
                      })
                    }
                  } else {
                    $total += ([System.IO.FileInfo]::new($entry)).Length
                  }
                } catch {
                  # Skip inaccessible entries.
                }
              }
            } catch {
              # Skip inaccessible root enumeration.
            }

            $result.Bytes = $total
            if ($Children) {
              $result.Children = @($childList | Sort-Object Name)
            }
            return $result
          }

          function Write-Root {
            param(
              [string]$Label,
              [string]$Path,
              [switch]$Children
            )

            if ([string]::IsNullOrWhiteSpace($Path)) {
              Write-Output "ROOT $Label path=<undefined> exists=false"
              return
            }

            $summary = Measure-RootSummary -Path $Path -Children:$Children
            if (-not $summary.Exists) {
              Write-Output "ROOT $Label path=$Path exists=false"
              return
            }

            Write-Output "ROOT $Label path=$Path bytes=$($summary.Bytes) ($(Format-Bytes -Bytes $summary.Bytes))"
            if ($Children) {
              foreach ($child in $summary.Children) {
                Write-Output "  SUB $Label/$($child.Name) bytes=$($child.Bytes) ($(Format-Bytes -Bytes $child.Bytes))"
              }
            }
          }

          $logicalDisks = Get-CimInstance -ClassName Win32_LogicalDisk -ErrorAction SilentlyContinue
          foreach ($letter in @('C:', 'D:')) {
            $d = $logicalDisks | Where-Object { $_.DeviceID -eq $letter } | Select-Object -First 1
            if (-not $d) {
              Write-Output "DISK $letter free=<missing>"
            } elseif ($d.DriveType -ne 3) {
              Write-Output "DISK $letter free=<not-fixed type=$($d.DriveType)>"
            } else {
              Write-Output "DISK $letter free=$($d.FreeSpace) bytes ($(Format-Bytes -Bytes ([long]$d.FreeSpace)))"
            }
          }

          $localAppDataValue = if ($env:LOCALAPPDATA) { $env:LOCALAPPDATA } else { '<undefined>' }
          $laDrive = '<undefined>'
          if ($env:LOCALAPPDATA) {
            try { $laDrive = [System.IO.Path]::GetPathRoot($env:LOCALAPPDATA).TrimEnd('\') } catch { $laDrive = '<invalid>' }
          }
          $laFree = '<unknown>'
          if ($laDrive -match '^[A-Za-z]:$') {
            $laDisk = $logicalDisks | Where-Object { $_.DeviceID -eq $laDrive } | Select-Object -First 1
            if (-not $laDisk) { $laFree = '<missing>' }
            elseif ($laDisk.DriveType -ne 3) { $laFree = "<not-fixed type=$($laDisk.DriveType)>" }
            else { $laFree = "$($laDisk.FreeSpace) bytes ($(Format-Bytes -Bytes ([long]$laDisk.FreeSpace)))" }
          }
          Write-Output "LOCALAPPDATA=$localAppDataValue drive=$laDrive free=$laFree"

          $rtcValue = if ($env:RUNNER_TOOL_CACHE) { $env:RUNNER_TOOL_CACHE } else { '<undefined>' }
          $androidHomeValue = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { '<undefined>' }
          Write-Output "RUNNER_TOOL_CACHE=$rtcValue"
          Write-Output "ANDROID_HOME=$androidHomeValue"

          Write-Output "MEASURE begin"
          Write-Root -Label 'ANDROID_HOME' -Path $env:ANDROID_HOME

          if ($env:RUNNER_TOOL_CACHE) {
            foreach ($lang in @('Java', 'Python', 'Ruby', 'Go')) {
              $p = Join-Path -Path $env:RUNNER_TOOL_CACHE -ChildPath $lang
              Write-Root -Label "RTC\$lang" -Path $p -Children
            }
          } else {
            foreach ($lang in @('Java', 'Python', 'Ruby', 'Go')) {
              Write-Root -Label "RTC\$lang" -Path $null
            }
          }

          Write-Root -Label 'PFx86Android' -Path 'C:\Program Files (x86)\Android'
          Write-Root -Label 'CAndroid' -Path 'C:\Android'
          Write-Root -Label 'hostedtoolcache' -Path 'C:\hostedtoolcache' -Children
          Write-Root -Label 'MSVS' -Path 'C:\Program Files\Microsoft Visual Studio' -Children
          Write-Output "MEASURE end"

          Write-Output "PREP date=$((Get-Date).ToUniversalTime().ToString('o')) host=$env:COMPUTERNAME user=$env:USERNAME"
          Write-Output "PREP pwsh=$($PSVersionTable.PSVersion) os=$([System.Environment]::OSVersion.VersionString) runner_os=$env:RUNNER_OS runner_arch=$env:RUNNER_ARCH"
          Write-Output "PREP cwd=$PWD temp=$env:TEMP"
          Write-Output "PREP complete"
