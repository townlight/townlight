name: installer-cleanroom

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/installer-cleanroom.yml"
      - "docs/installer/**"
      - "installer/**"
      - "scripts/plan-installer.py"
      - "scripts/reclaim-installer-cleanroom-space.py"
      - "scripts/run-clerk-core-installer.py"
      - "scripts/run-installer-package-cleanroom.py"
      - "scripts/verify-installer-plan.py"

env:
  TOWNLIGHT_PYTHON_VERSION: "3.12"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-readiness-plan:
    name: ${{ matrix.platform }} archive readiness and plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TOWNLIGHT_CLEANROOM_HOST_CLEANUP_APPROVED: "1"
      TOWNLIGHT_CLEANROOM_MIN_FREE_GB: "40"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            profile: clerk-core
            # workflow-cost: windows-pr-justification -- validates the double-click installer wrapper plan on the only host family that can exercise it.
            os: windows-latest
            archive: installer/dist/Townlight-clerk-core-windows-0.1.0.zip
            installer_version: 0.1.0
          - platform: macos
            profile: clerk-core
            os: ubuntu-latest
            archive: installer/dist/Townlight-clerk-core-macos-0.1.0.tar.gz
            installer_version: 0.1.0
          - platform: linux
            profile: clerk-core
            os: ubuntu-latest
            archive: installer/dist/Townlight-clerk-core-linux-0.1.0.tar.gz
            installer_version: 0.1.0
          - platform: windows
            profile: city-core
            # workflow-cost: windows-pr-justification -- city-core release criteria require Windows one-click wrapper readiness evidence.
            os: windows-latest
            archive: installer/dist/Townlight-city-core-windows-0.1.0.zip
            installer_version: 0.1.0
          - platform: macos
            profile: city-core
            os: ubuntu-latest
            archive: installer/dist/Townlight-city-core-macos-0.1.0.tar.gz
            installer_version: 0.1.0
          - platform: linux
            profile: city-core
            os: ubuntu-latest
            archive: installer/dist/Townlight-city-core-linux-0.1.2.tar.gz
            installer_version: 0.1.2
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check out Townlight Records bundle source
        uses: actions/checkout@v5
        with:
          repository: townlight/sunshine
          ref: ad5559709bce55e3dd53e3a3ca45b3b234730099
          path: modules/townlight_records

      - name: Check out TownlightMeetings bundle source
        uses: actions/checkout@v5
        with:
          repository: townlight/meetings
          ref: e0577a165cc8f09a3597ec3ce54ecc23168f8d62
          path: modules/townlight_meetings

      - name: Check out TownlightCode bundle source
        uses: actions/checkout@v5
        with:
          repository: townlight/ordinances
          ref: 22d00f560cc45088a5b24a3f997787ee9c7a5e31
          path: modules/townlight_code

      - name: Check out Townlight Notice bundle source
        uses: actions/checkout@v5
        with:
          repository: townlight/notice
          ref: 4edf01296b0ad56a331e7fdd9b7c2d19c20b8e48
          path: modules/townlight_notice

      - name: Check out Townlight Access bundle source
        uses: actions/checkout@v5
        with:
          repository: townlight/access
          ref: f377a9a6e2a14d890333a20eab9277d644a9aaeb
          path: modules/townlight_access

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.TOWNLIGHT_PYTHON_VERSION }}
          cache: pip

      - name: Generate release artifacts
        run: python scripts/plan-installer.py --profile "${{ matrix.profile }}" --generate-release-artifacts --installer-version "${{ matrix.installer_version }}"

      - name: Reclaim hosted-runner workspace before package plan
        if: runner.os == 'Linux'
        run: python scripts/reclaim-installer-cleanroom-space.py --run-id "ci-${{ matrix.profile }}-${{ matrix.platform }}-package-plan" --approved

      - name: Run extracted package readiness and plan
        run: python scripts/run-installer-package-cleanroom.py --archive "${{ matrix.archive }}" --platform "${{ matrix.platform }}" --skip-install --run-id "ci-${{ matrix.profile }}-${{ matrix.platform }}-package-plan"

      - name: Upload readiness and plan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.profile }}-${{ matrix.platform }}-package-plan
          path: installer/reports/ci-${{ matrix.profile }}-${{ matrix.platform }}-package-plan/
          retention-days: 7

  linux-package-lifecycle:
    name: linux archive full lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TOWNLIGHT_CLEANROOM_HOST_CLEANUP_APPROVED: "1"
      TOWNLIGHT_CLEANROOM_MIN_FREE_GB: "40"
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - profile: clerk-core
            archive: installer/dist/Townlight-clerk-core-linux-0.1.0.tar.gz
            run_id: ci-linux-package-lifecycle
            installer_version: 0.1.0
          - profile: city-core
            archive: installer/dist/Townlight-city-core-linux-0.1.2.tar.gz
            run_id: ci-city-core-linux-package-lifecycle
            installer_version: 0.1.2
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check out Townlight Records bundle source
        uses: actions/checkout@v5
        with:
          repository: townlight/sunshine
          ref: ad5559709bce55e3dd53e3a3ca45b3b234730099
          path: modules/townlight_records

      - name: Check out TownlightMeetings bundle source
        uses: actions/checkout@v5
        with:
          repository: townlight/meetings
          ref: e0577a165cc8f09a3597ec3ce54ecc23168f8d62
          path: modules/townlight_meetings

      - name: Check out TownlightCode bundle source
        uses: actions/checkout@v5
        with:
          repository: townlight/ordinances
          ref: 22d00f560cc45088a5b24a3f997787ee9c7a5e31
          path: modules/townlight_code

      - name: Check out Townlight Notice bundle source
        uses: actions/checkout@v5
        with:
          repository: townlight/notice
          ref: 4edf01296b0ad56a331e7fdd9b7c2d19c20b8e48
          path: modules/townlight_notice

      - name: Check out Townlight Access bundle source
        uses: actions/checkout@v5
        with:
          repository: townlight/access
          ref: f377a9a6e2a14d890333a20eab9277d644a9aaeb
          path: modules/townlight_access

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.TOWNLIGHT_PYTHON_VERSION }}
          cache: pip

      - name: Generate release artifacts
        run: python scripts/plan-installer.py --profile "${{ matrix.profile }}" --generate-release-artifacts --installer-version "${{ matrix.installer_version }}"

      - name: Reclaim hosted-runner workspace before lifecycle
        run: python scripts/reclaim-installer-cleanroom-space.py --run-id "${{ matrix.run_id }}" --approved

      - name: Run extracted Linux package install, repair, verify, workflow proof, backup, restore, and uninstall
        run: python scripts/run-installer-package-cleanroom.py --archive "${{ matrix.archive }}" --platform linux --run-id "${{ matrix.run_id }}" --staff-mode bearer --workflow-proof

      - name: Upload Linux lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.profile }}-linux-package-lifecycle
          path: installer/reports/${{ matrix.run_id }}/
          retention-days: 7
