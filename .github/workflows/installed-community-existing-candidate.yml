name: Installed community existing signed candidate
on:
  workflow_dispatch:

jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Exercise actual fixture trust functions
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'

          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'desktop/scripts/test-installed-maintenance.ps1'
          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
            throw "Missing script: $scriptPath"
          }

          $tokens = $null
          $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors -and $parseErrors.Count -gt 0) {
            throw "Parser errors: $($parseErrors.Message -join '; ')"
          }

          $defs = @($ast.FindAll({
            param($node)
            $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and (
              $node.Name -eq 'Add-CommunityFixtureTrust' -or
              $node.Name -eq 'Remove-CommunityFixtureTrust'
            )
          }, $true))
          if ($defs.Count -ne 2) {
            throw "Expected exactly 2 fixture trust functions, found $($defs.Count)."
          }

          $addAst = @($defs | Where-Object { $_.Name -eq 'Add-CommunityFixtureTrust' })
          $removeAst = @($defs | Where-Object { $_.Name -eq 'Remove-CommunityFixtureTrust' })
          if ($addAst.Count -ne 1 -or $removeAst.Count -ne 1) {
            throw 'Expected one Add and one Remove FunctionDefinitionAst.'
          }

          $addDefinition = $addAst[0].Extent.Text
          $instrumentedAdd = $addDefinition.Replace('$store.Add($cert)', 'Write-Host "enter CurrentUser store.Add"; $store.Add($cert); Write-Host "returned CurrentUser store.Add"')
          if ($instrumentedAdd -eq $addDefinition) {
            throw 'Add function does not contain the expected $store.Add($cert) call.'
          }

          . ([scriptblock]::Create($instrumentedAdd))
          . ([scriptblock]::Create($removeAst[0].Extent.Text))
          Write-Host 'phase: extracted-and-instrumented-functions'

          $rsa = [System.Security.Cryptography.RSA]::Create(2048)
          try {
            $request = [System.Security.Cryptography.X509Certificates.CertificateRequest]::new(
              'CN=Installed Community Existing Candidate Test CA',
              $rsa,
              [System.Security.Cryptography.HashAlgorithmName]::SHA256,
              [System.Security.Cryptography.RSASignaturePadding]::Pkcs1
            )
            $request.CertificateExtensions.Add([System.Security.Cryptography.X509Certificates.X509BasicConstraintsExtension]::new($true, $false, 0, $true))
            $keyUsage = [System.Security.Cryptography.X509Certificates.X509KeyUsageFlags]::KeyCertSign -bor [System.Security.Cryptography.X509Certificates.X509KeyUsageFlags]::CrlSign
            $request.CertificateExtensions.Add([System.Security.Cryptography.X509Certificates.X509KeyUsageExtension]::new($keyUsage, $true))
            $cert = $request.CreateSelfSigned([System.DateTimeOffset]::UtcNow.AddMinutes(-1), [System.DateTimeOffset]::UtcNow.AddHours(1))
          } finally {
            $rsa.Dispose()
          }

          $certPath = Join-Path $env:RUNNER_TEMP 'community-fixture-test-ca.cer'
          [System.IO.File]::WriteAllBytes($certPath, $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          Write-Host "phase: generated-and-exported-public-ca $certPath"

          $fixture = [pscustomobject]@{ OwnedCertificate = $null }
          try {
            Add-CommunityFixtureTrust $fixture $certPath
            Write-Host 'phase: add-returned'
          } finally {
            Remove-CommunityFixtureTrust $fixture
            Write-Host 'phase: remove-returned'
          }
          Write-Host 'phase: complete'
