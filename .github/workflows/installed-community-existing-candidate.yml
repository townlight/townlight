name: Installed ULE signed candidate

on:
  workflow_dispatch:
    inputs:
      signing_run_id:
        description: Signing workflow run ID
        required: true
        type: string
      build_run_id:
        description: Build workflow run ID
        required: true
        type: string
      source_commit:
        description: Source commit
        required: true
        type: string
      intake_sha256:
        description: Intake SHA-256
        required: true
        type: string
      unsigned_msi_sha256:
        description: Unsigned MSI SHA-256
        required: true
        type: string
      msi_sha256:
        description: Signed MSI SHA-256
        required: true
        type: string
      exe_sha256:
        description: Signed EXE SHA-256
        required: true
        type: string
      mode:
        description: Installer test mode
        required: true
        type: choice
        options:
          - ule
          - ule-upgrade
        default: ule
      portal_commit:
        description: Portal commit
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}/${{ github.ref }}/${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  installed-ule-signed-candidate:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: townlight
          fetch-depth: 0

      - name: Checkout portal source
        if: ${{ inputs.portal_commit != '' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.portal_commit }}
          path: portal-source
          fetch-depth: 0

      - name: Download signed native payload
        uses: actions/download-artifact@v4
        with:
          name: signed-native-payload
          run-id: ${{ inputs.signing_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: signed-artifact

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: townlight/desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install desktop dependencies
        run: npm ci
        working-directory: townlight/desktop

      - name: Install portal locked dependencies
        run: pip install --require-hashes -r requirements.lock
        working-directory: townlight/portal

      - name: Install portal test dependency
        run: pip install aiosmtpd==1.4.6
        working-directory: townlight/portal

      - name: Prepare installer test volume
        shell: pwsh
        run: ./townlight/desktop/scripts/prepare-installer-test-volume.ps1

      - name: Verify and execute installed candidate
        shell: pwsh
        working-directory: townlight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ULE_SIGN_RUN: ${{ inputs.signing_run_id }}
          ULE_BUILD_RUN: ${{ inputs.build_run_id }}
          ULE_SOURCE: ${{ inputs.source_commit }}
          ULE_INTAKE: ${{ inputs.intake_sha256 }}
          ULE_UNSIGNED: ${{ inputs.unsigned_msi_sha256 }}
          ULE_MSI: ${{ inputs.msi_sha256 }}
          ULE_EXE: ${{ inputs.exe_sha256 }}
          ULE_MODE: ${{ inputs.mode }}
          ULE_PORTAL: ${{ inputs.portal_commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $null = & ./desktop/scripts/verify-ule-build-provenance.ps1 `
            -BuildRun $env:ULE_BUILD_RUN `
            -SigningRun $env:ULE_SIGN_RUN `
            -SourceCommit $env:ULE_SOURCE
          $verified = & ./desktop/scripts/verify-ule-signed-artifact.ps1 `
            -SignedArtifactRoot ../signed-artifact `
            -ExpectedSigningRun $env:ULE_SIGN_RUN `
            -ExpectedIntakeSha256 $env:ULE_INTAKE `
            -ExpectedUnsignedMsiSha256 $env:ULE_UNSIGNED `
            -ExpectedMsiSha256 $env:ULE_MSI `
            -ExpectedExeSha256 $env:ULE_EXE
          $evidenceRoot = Join-Path $env:RUNNER_TEMP ('installed-ule-' + $env:ULE_MODE)
          New-Item -ItemType Directory -Force -Path $evidenceRoot | Out-Null
          $verified | ConvertTo-Json -Depth 10 | Set-Content -Path (Join-Path $evidenceRoot 'candidate-identity.json') -Encoding utf8
          $maintenanceArgs = @{}
          if (-not [string]::IsNullOrWhiteSpace($env:ULE_PORTAL)) {
            $maintenanceArgs.PortalCheckout = [System.IO.Path]::GetFullPath((Join-Path (Get-Location) '../portal-source'))
            $maintenanceArgs.ExpectedPortalCommit = $env:ULE_PORTAL
          }
          & ./desktop/scripts/test-installed-maintenance.ps1 `
            -MsiPath $verified.msi_path `
            -Mode $env:ULE_MODE `
            -EvidenceRoot $evidenceRoot `
            -ExpectedMsiSha256 $env:ULE_MSI `
            -SourceCommit $env:ULE_SOURCE `
            @maintenanceArgs

      - name: Upload installed candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-ule-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/installed-ule-${{ inputs.mode }}/**
            !${{ runner.temp }}/installed-ule-${{ inputs.mode }}/**/community-fixture/publisher.token
            !${{ runner.temp }}/installed-ule-${{ inputs.mode }}/**/resident.key
            !${{ runner.temp }}/installed-ule-${{ inputs.mode }}/**/tls/localhost.key
          retention-days: 7