name: Portal verification
on:
  pull_request:
    paths: ['portal/**', 'desktop/runtime/python-services/civicsuite_runtime/portal_publication.py', 'desktop/runtime/python-services/civicsuite_runtime/services.py', 'scripts/portal-e2e*', '.github/workflows/portal-verify.yml']
  push:
    paths: ['portal/**', 'desktop/runtime/python-services/civicsuite_runtime/portal_publication.py', 'desktop/runtime/python-services/civicsuite_runtime/services.py', 'scripts/portal-e2e*', '.github/workflows/portal-verify.yml']
permissions:
  contents: read
jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r requirements.lock
        working-directory: portal
      - run: python manage.py test website
        working-directory: portal
      - run: python manage.py makemigrations --check --dry-run
        working-directory: portal
      - run: python -m py_compile desktop/runtime/python-services/civicsuite_runtime/portal_publication.py
