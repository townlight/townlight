name: Windows signing OIDC probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Record exact federation subject
        shell: pwsh
        run: |
          $uri = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange"
          $token = (Invoke-RestMethod -Uri $uri -Headers @{Authorization="Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"}).value
          $part = $token.Split('.')[1].Replace('-','+').Replace('_','/')
          $part = $part.PadRight($part.Length + ((4 - $part.Length % 4) % 4), '=')
          $claims = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($part)) | ConvertFrom-Json
          Write-Host "Federation subject: $($claims.sub)"
          Write-Host "Federation issuer: $($claims.iss)"
          Write-Host "Federation audience: $($claims.aud)"
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Build disposable signing probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path probe | Out-Null
          'class Probe { static void Main() { System.Console.WriteLine("Townlight OIDC signing probe; not a product release."); } }' | Set-Content probe/Probe.cs
          & "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe" /nologo /out:probe/Probe.exe probe/Probe.cs
          if ($LASTEXITCODE -ne 0) { throw 'Probe compilation failed.' }
      - uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://wcus.codesigning.azure.net
          signing-account-name: scottconverse-signing
          certificate-profile-name: ScottConversePublic
          files-folder: ${{ github.workspace }}/probe
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Independently verify and record probe
        shell: pwsh
        run: |
          ./desktop/scripts/verify-publication-signature.ps1 -Path probe/Probe.exe
          $sig = Get-AuthenticodeSignature probe/Probe.exe
          @{ source_commit=$env:GITHUB_SHA; sha256=(Get-FileHash probe/Probe.exe -Algorithm SHA256).Hash; subject=$sig.SignerCertificate.Subject; status="$($sig.Status)"; auth='GitHub main-only OIDC'; release_changed=$false } | ConvertTo-Json | Set-Content probe/receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: oidc-signing-probe
          path: probe/receipt.json
          retention-days: 7
