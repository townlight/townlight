name: verify

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-verify-relevant-changes:
    name: detect verify-relevant changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Compute whether this diff touches verify-relevant paths
        id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          zero_sha="0000000000000000000000000000000000000000"
          if [ -z "$base" ] || [ "$base" = "$zero_sha" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! changed=$(git diff --name-only "$base" "$head" 2>&1); then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$changed" | grep -Eq '^\.github/workflows/verify\.yml$|^config/|^desktop/package(-lock)?\.json$|^docs/|^installer/|^scripts/|^tests/|^\.agent-workflows/|^[^/]+\.md$|^[^/]+\.txt$|^[^/]+\.json$|^[^/]+\.toml$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: detect-verify-relevant-changes
    if: needs.detect-verify-relevant-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/runtime/python-services/pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Verify documentation
        run: bash scripts/verify-docs.sh

      - name: Verify visitor-facing voice standard
        run: python scripts/docs/check_voice.py

      - name: Verify no committed secret patterns
        run: python scripts/verify-secret-scan.py

      - name: Verify stage evidence
        run: python scripts/policy/check_stage_evidence.py

      - name: Install suite-state verifier dependencies
        run: python -m pip install "jsonschema>=4.23,<5" "pytest>=8,<9"

      - name: Verify canonical Townlight suite state
        run: |
          python scripts/check-suite-state.py
          python -m pytest tests/test_suite_state.py tests/test_module_manifest_contract.py tests/test_windows_msi_workflow_contract.py -q

      - name: Install desktop dependencies for security audit
        working-directory: desktop
        run: npm ci

      - name: Audit desktop dependencies
        working-directory: desktop
        run: npm audit --audit-level=moderate

      - name: Install Node dependencies
        run: npm ci

      - name: Install browser for docs landing page check
        run: npx playwright install --with-deps chromium

      - name: Verify docs landing page in browser
        run: npm run verify:browser

      - name: Install deployment verifier dependency
        run: python -m pip install pyyaml "build>=1.2,<2" "packaging>=24,<27"

      - name: Verify deployment profile statically
        run: |
          python scripts/demo_wheels.py
          python scripts/verify-deployment-profile.py --static-only
          python -m pytest tests/test_deployment_wheels.py -q

      - name: Verify installer plan
        run: python scripts/verify-installer-plan.py --platform windows

      - name: Verify suite state against GitHub releases
        env:
          GH_TOKEN: ${{ secrets.TOWNLIGHT_GITHUB_TOKEN || secrets.TOWNLIGHT_GH_TOKEN || secrets.GH_TOKEN || github.token }}
        run: python scripts/verify-suite-state.py --remote-only

      - name: Verify public module status blocks
        run: python scripts/docs/render_public_status.py --check

      - name: Verify vendored design tokens match the townlight_core authority
        env:
          GH_TOKEN: ${{ secrets.TOWNLIGHT_GITHUB_TOKEN || secrets.TOWNLIGHT_GH_TOKEN || secrets.GH_TOKEN || github.token }}
        run: python scripts/design/check_tokens_vendored.py
